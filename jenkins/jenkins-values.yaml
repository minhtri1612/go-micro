# Cấu hình values cho Jenkins Helm Chart
controller:
  # Chart 5.1.20 để image jenkins/jenkins ~2.452.1; dependency của workflow/git/casc hiện đòi core ≥ 2.479.x.
  image:
    tag: "2.479.3-lts-jdk17"

  # Trùng version default của chart Jenkins 5.1.20 (jenkins/jenkins-values.yaml trong chart).
  # List lệch version với image chart → init container (jenkins-plugin-cli) hay CrashLoop.
  installPlugins:
    - kubernetes:4230.vceef11cb_ca_37
    - workflow-aggregator:596.v8c21c963d92d
    - git:5.2.2
    - configuration-as-code:1807.v0175eda_00a_20
    # Tạo job từ YAML (JCasC block `jobs:`) — khai báo pipeline GitHub dưới dạng code.
    - job-dsl:1.87

  # Giảm fetch “latest deps” — ít lỗi mạng / ít biến động khi bootstrap Kind.
  installLatestPlugins: false

  # Init `init` chạy jenkins-plugin-cli — mặc định chart để rỗng/ít RAM → dễ OOM → CrashLoop.
  initContainerResources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "3Gi"

  # Cấu hình Persistent Volume để lưu trữ dữ liệu Jenkins (Jobs, History, Configs)
  persistence:
    enabled: true
    storageClass: standard
    size: "10Gi"
    
  # Cho phép chạy pipeline trên controller (Kind/demo). Agent K8s riêng có thể đặt lại 0.
  numExecutors: 1

  # Đặt múi giờ cho Jenkins
  javaOpts: "-Duser.timezone=Asia/Ho_Chi_Minh"
  
  # Tạo Ingress để truy cập UI nếu muốn. 
  # Ở đây tạm thời disabled để dùng port-forward cho an toàn. Bạn có thể tự mở lên sau.
  ingress:
    enabled: false
    # apiVersion: networking.k8s.io/v1
    # hostName: jenkins.go-micro.local
    # annotations:
    #   traefik.ingress.kubernetes.io/router.entrypoints: web
  
  # JCasC: defaultConfig + job DSL — job "go-micro" trỏ GitHub + Jenkinsfile ở root repo.
  JCasC:
    defaultConfig: true
    configScripts:
      01-github-pipeline-job: |
        jobs:
          - script: |
              pipelineJob('go-micro') {
                displayName('go-micro (GitHub)')
                definition {
                  cpsScm {
                    lightweight(true)
                    scm {
                      git {
                        remote {
                          url('https://github.com/minhtri1612/go-micro.git')
                        }
                        branch('*/main')
                      }
                    }
                    scriptPath('Jenkinsfile')
                  }
                }
              }

  # Cấu hình tài nguyên để tránh Jenkins nuốt quá nhiều RAM trên cụm Kind
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

# Phân quyền cho Agent (Kubernetes plugin) để có thể chạy kubectl/helm bên trong pipeline
serviceAccountAgent:
  create: true
  
rbac:
  create: true
