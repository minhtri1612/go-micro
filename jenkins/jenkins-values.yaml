# Cấu hình values cho Jenkins Helm Chart
# Controller image: build từ jenkins/Dockerfile (plugin đóng gói sẵn) — không dùng installPlugins runtime.
controller:
  image:
    repository: minhtri1612/jenkins-custom
    tag: "2.492.3-lts-jdk17-pkg1"
    pullPolicy: IfNotPresent

  admin:
    username: "admin"
    password: "admin"

  # Plugin đã bake trong image — init không tải từ Update Center (tránh chờ dài).
  installPlugins:
    - pipeline-stage-view

  installLatestPlugins: false

  # Init nhẹ hơn (không jenkins-plugin-cli nặng); giữ RAM phòng chart vẫn chạy bước copy.
  initContainerResources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

  persistence:
    enabled: true
    storageClass: standard
    size: "10Gi"

  numExecutors: 1

  javaOpts: "-Duser.timezone=Asia/Ho_Chi_Minh"

  ingress:
    enabled: false

  JCasC:
    defaultConfig: true
    configScripts:
      01-github-pipeline-job: |
        jobs:
          - script: |
              pipelineJob('go-micro') {
                displayName('go-micro (GitHub)')
                definition {
                  cpsScm {
                    lightweight(true)
                    scm {
                      git {
                        remote {
                          url('https://github.com/minhtri1612/go-micro.git')
                        }
                        branch('*/main')
                      }
                    }
                    scriptPath('Jenkinsfile')
                  }
                }
              }

  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

serviceAccountAgent:
  create: true

rbac:
  create: true
