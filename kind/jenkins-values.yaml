# Jenkins Helm values cho Kind lab (management cluster)
# Dùng docker.sock mount từ host – đơn giản nhất cho local lab
# Chart: jenkins/jenkins

controller:
  # Expose qua MetalLB (LoadBalancer IP tĩnh trên Docker network kind)
  serviceType: LoadBalancer
  serviceAnnotations:
    metallb.universe.tf/loadBalancerIPs: "172.18.255.49"

  # Tắt Ingress (truy cập trực tiếp qua LoadBalancer IP)
  ingress:
    enabled: false

  # Giảm resource cho lab
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

  # Admin credentials (đổi lại sau khi cài)
  admin:
    username: admin
    password: "admin123"  # ← ĐỔI SAU KHI CÀI

  # JVM options
  javaOpts: "-Xmx1g -Xms512m"

  # Cho phép truy cập script console (cần cho config tay)
  scriptApproval:
    - "method groovy.json.JsonOutput toJson java.lang.Object"
    - "method javaposse.jobdsl.dsl.DslFactory pipelineJob java.lang.String"
    - "new javaposse.jobdsl.dsl.helpers.workflow.CpsScmContext"
    - "method javaposse.jobdsl.dsl.helpers.workflow.WorkflowDefinitionContext cpsScm groovy.lang.Closure"
    - "method javaposse.jobdsl.dsl.helpers.workflow.CpsScmContext scm groovy.lang.Closure"
    - "method javaposse.jobdsl.dsl.helpers.scm.ScmContext git groovy.lang.Closure"
    - "method javaposse.jobdsl.dsl.helpers.scm.GitContext remote groovy.lang.Closure"
    - "method javaposse.jobdsl.dsl.helpers.scm.RemoteContext url java.lang.String"
    - "method javaposse.jobdsl.dsl.helpers.scm.RemoteContext credentials java.lang.String"
    - "method javaposse.jobdsl.dsl.helpers.scm.GitContext branch java.lang.String"
    - "method javaposse.jobdsl.dsl.helpers.workflow.CpsScmContext scriptPath java.lang.String"

  # Jenkins 2.528+ + chart 5.8.110: default crumbIssuer config có thể sinh field JCasC
  # không tương thích (excludeClientIPFromCrumb). Ép disable để tránh CrashLoop.
  csrf:
    defaultCrumbIssuer:
      enabled: false

  # Pin plugin set để tránh mismatch dependency với Jenkins core.
  installLatestPlugins: false
  installLatestSpecifiedPlugins: false
  initializeOnce: true
  installPlugins:
    - kubernetes:4392.v19cea_fdb_5913
    - workflow-aggregator:608.v67378e9d3db_1
    - git:5.8.0
    - configuration-as-code:2006.v001a_2ca_6b_574
    - job-dsl:1.93

  # Auto bootstrap credentials + pipeline từ GitHub qua JCasC/Job DSL.
  additionalSecrets:
    - name: github-user
      value: "minhtri1612"
    - name: github-token
      value: "REPLACE_ME_GITHUB_PAT"
    - name: dockerhub-user
      value: "REPLACE_ME_DOCKERHUB_USER"
    - name: dockerhub-pass
      value: "REPLACE_ME_DOCKERHUB_TOKEN"

  JCasC:
    configScripts:
      ci-credentials: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      scope: GLOBAL
                      id: "github-credentials"
                      username: "${github-user}"
                      password: "${github-token}"
                      description: "GitHub HTTPS credential for Jenkins pipeline"
                  - usernamePassword:
                      scope: GLOBAL
                      id: "dockerhub-credentials"
                      username: "${dockerhub-user}"
                      password: "${dockerhub-pass}"
                      description: "Docker Hub credential for Jenkins pipeline"
      ci-pipeline-job: |
        jobs:
          - script: >
              pipelineJob('go-micro-gitops') {
                description('Build and push images, then bump env tags for Argo CD canary rollout.')
                parameters {
                  stringParam('TAG', 'v1.0.6', 'Image tag mới cần build & push (ví dụ: v1.0.6)')
                  choiceParam('ENV', ['dev', 'staging', 'prod'], 'Environment cần update image tag')
                  booleanParam('ALL_SERVICES', true, 'Update tag cho tất cả services')
                  stringParam('SERVICES', 'product inventory order payment noti client', 'Danh sách service cần update nếu ALL_SERVICES=false')
                }
                definition {
                  cpsScm {
                    scm {
                      git {
                        remote {
                          url('https://github.com/minhtri1612/go-micro.git')
                          credentials('github-credentials')
                        }
                        branch('*/main')
                      }
                    }
                    scriptPath('Jenkinsfile')
                  }
                }
              }

agent:
  enabled: true
  # Mount docker.sock từ host để agent chạy docker build được
  volumes:
    - type: HostPath
      hostPath: /var/run/docker.sock
      mountPath: /var/run/docker.sock
  # Cấp quyền cho agent đọc docker.sock
  podRetention: OnFailure
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

persistence:
  enabled: true
  size: 5Gi

# ServiceAccount cho Jenkins controller
serviceAccount:
  create: true
  name: jenkins
