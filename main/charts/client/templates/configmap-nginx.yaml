apiVersion: v1
kind: ConfigMap
metadata:
  name: client-nginx-config
  namespace: {{ .Values.app.namespace | default .Release.Namespace }}
  labels:
    app: {{ include "client.name" . }}
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
        
        location /api/ {
            proxy_pass http://go-micro-api-gateway:8089;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
