# Helm Cilium **lần đầu** trên management (trước kube-prometheus-stack; hoặc khi chưa có AWS CCM).
# Dùng cùng lúc với cilium-values-management.yaml:
#   helm upgrade --install cilium ... -f .../cilium-values-management.yaml -f .../cilium-values-management-bootstrap.yaml
#
# Override 2 thứ chưa có lúc bootstrap:
# 1) ServiceMonitor CRD (chưa cài Prometheus Operator)
# 2) LoadBalancer → NodePort (không có cloud LB / lab local — Helm --wait khỏi treo EXTERNAL-IP)
#
# Trên AWS RKE2 có CCM: thường **không** cần file bootstrap này cho clustermesh; dùng LoadBalancer (NLB) từ cloud.

hubble:
  metrics:
    serviceMonitor:
      enabled: false

prometheus:
  serviceMonitor:
    enabled: false

operator:
  prometheus:
    serviceMonitor:
      enabled: false

clustermesh:
  apiserver:
    service:
      type: NodePort
