# Cilium trên cluster **management** (hub ClusterMesh + Hubble UI). GitOps / Argo: app `cilium-management`.
# cluster.id/name: management / 1. Spoke: cilium-cluster-{dev,prod}.yaml (id 2,3) + clustermesh-management-peer.yaml.
# Helm **tay** lần đầu (trước Prometheus Operator): thêm `-f cilium-values-management-bootstrap.yaml` để tắt ServiceMonitor.

cluster:
  name: management
  id: 1

kubeProxyReplacement: true
devices: "eth0"

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - "10.200.0.0/16"
    clusterPoolIPv4MaskSize: 24

l7Proxy: false

loadBalancer:
  algorithm: maglev

encryption:
  enabled: false

clustermesh:
  useAPIServer: true
  # Kind management 1 node: mặc định chart / bản cũ có thể replicas=2 → pod 2 Pending →
  # `cilium clustermesh status` lỗi "only 1 of 2 replicas are available".
  apiserver:
    replicas: 1
    tls:
      server:
        extraDnsNames:
          - "*.mesh.cilium.io"
    service:
      # AWS: CCM tạo NLB/ELB; không dùng MetalLB. Kind lab: NodePort qua cilium-values-management-bootstrap.yaml.
      type: LoadBalancer
  config:
    enabled: true
    # Phải khớp cluster.name trên spoke (dev, prod). Tạo key trong Secret
    # cilium-clustermesh (+ cilium-kvstoremesh) trên hub — không có thì `cilium clustermesh status`
    # luôn báo "No cluster connected" dù agent spoke đã nối etcd (CLI đọc secret để biết tên peer).
    # GitOps ClusterMesh: hub trỏ tới endpoint clustermesh-apiserver của từng spoke.
    # AWS: sau khi spoke có EXTERNAL-IP/NLB, chạy ./scripts/sync-clustermesh-hub-spoke-ips.sh (cần yq + kubectl).
    # 203.0.113.0/24 = TEST-NET (RFC 5737) — placeholder; trước prod chạy scripts/sync-clustermesh-hub-spoke-ips.sh.
    clusters:
      - name: dev
        ips:
          - 203.0.113.10
        port: 2379
      - name: prod
        ips:
          - 203.0.113.11
        port: 2379

bpf:
  lbExternalClusterIP: true
  events:
    drop:
      enabled: true
    policyVerdict:
      enabled: true
    trace:
      enabled: true

hubble:
  enabled: true
  eventBufferCapacity: "16383"
  networkPolicyCorrelation:
    enabled: true
  redact:
    enabled: false
  skipUnknownCGroupIDs: false
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
      - dns:query
      - drop
      - tcp
      - flow
      - icmp
      - http
      - port-distribution
    enableOpenMetrics: true
    serviceMonitor:
      enabled: true
    dashboards:
      enabled: false

prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    trustCRDsExist: true

operator:
  replicas: 1
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
