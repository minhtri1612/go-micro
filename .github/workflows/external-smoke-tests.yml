# External smoke tests (scripts under tests/).
#
# - pull_request: chỉ kiểm tra cú pháp shell (không cần cluster).
# - workflow_dispatch: chạy curl/k6 từ runner — cần backend/ingress tới được từ internet
#   (hoặc self-hosted runner trong VPC).
#
# Quan trọng: input `services` — để `all` thì chạy full matrix; để `product` hoặc
# `product,inventory` thì chỉ chạy đúng service đó (không liên quan tới việc bạn đổi tag trong env/dev.yaml).
name: External smoke tests

on:
  pull_request:
    paths:
      - "tests/**"
      - ".github/workflows/external-smoke-tests.yml"
  workflow_dispatch:
    inputs:
      services:
        description: 'Chạy test cho service nào. `all` = full matrix. Hoặc CSV: product | product,inventory | order,...'
        required: false
        default: "all"
      backend_host:
        description: "Host/IP mà từ runner curl được tới đúng port từng service (8080 product, 8081 order, …) — ví dụ sau port-forward hoặc LB nội bộ."
        required: true
        default: "127.0.0.1"
      route_host:
        description: "Host dùng cho route smoke (URL + header Host), ví dụ dev.go-micro.local."
        required: true
        default: "dev.go-micro.local"
      route_ip:
        description: "Nếu nhập IP, workflow sẽ ghi /etc/hosts để route_host resolve được trên runner (tuỳ chọn)."
        required: false
        default: ""
      k6_vus:
        description: "k6 virtual users"
        required: false
        default: "5"
      k6_duration:
        description: "k6 duration"
        required: false
        default: "15s"
      k6_error_rate:
        description: "k6 http_req_failed threshold (rate<value)"
        required: false
        default: "0.1"

permissions:
  contents: read

concurrency:
  group: external-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-shell:
    name: Validate test scripts (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: sh -n on all test shell scripts
        run: |
          set -euo pipefail
          find tests -type f -name "*.sh" -print | while read -r f; do
            echo "==> sh -n $f"
            sh -n "$f"
          done
          chmod +x tests/*/run.sh || true

  # Chỉ chạy khi workflow_dispatch: sinh JSON matrix theo input services.
  prepare-matrices:
    name: Prepare service matrix
    needs: validate-shell
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      route_services: ${{ steps.gen.outputs.route_services }}
      route_count: ${{ steps.gen.outputs.route_count }}
      business_services: ${{ steps.gen.outputs.business_services }}
      business_count: ${{ steps.gen.outputs.business_count }}
      dependency_services: ${{ steps.gen.outputs.dependency_services }}
      dependency_count: ${{ steps.gen.outputs.dependency_count }}
      target_services: ${{ steps.gen.outputs.target_services }}
      target_count: ${{ steps.gen.outputs.target_count }}
      k6_services: ${{ steps.gen.outputs.k6_services }}
      k6_count: ${{ steps.gen.outputs.k6_count }}
    steps:
      - id: gen
        env:
          SERVICES: ${{ github.event.inputs.services }}
        run: |
          set -euo pipefail
          OUT=$(jq -n --arg s "${SERVICES:-all}" '
            def filt($allow; $raw):
              ($raw | ascii_downcase | gsub("^\\s+|\\s+$";"")) as $t
              | if ($t == "" or $t == "all") then $allow
                else
                  ($t | split(",") | map(gsub("^\\s+|\\s+$";"")) | map(select(length > 0))) as $u
                  | $allow | map(select(. as $x | $u | index($x) != null))
                end;
            def route: ["product","inventory","order","payment","noti"];
            def business: ["product","inventory","payment","noti"];
            def target: ["product","inventory","order","payment","noti","client"];
            def k6: ["product","inventory","order","payment","noti"];
            {
              route: filt(route; $s),
              business: filt(business; $s),
              dependency: filt(business; $s),
              target: filt(target; $s),
              k6: filt(k6; $s)
            }
          ')
          echo "$OUT" | jq .

          echo "route_services=$(echo "$OUT" | jq -c '.route')" >> "$GITHUB_OUTPUT"
          echo "route_count=$(echo "$OUT" | jq '.route | length')" >> "$GITHUB_OUTPUT"
          echo "business_services=$(echo "$OUT" | jq -c '.business')" >> "$GITHUB_OUTPUT"
          echo "business_count=$(echo "$OUT" | jq '.business | length')" >> "$GITHUB_OUTPUT"
          echo "dependency_services=$(echo "$OUT" | jq -c '.dependency')" >> "$GITHUB_OUTPUT"
          echo "dependency_count=$(echo "$OUT" | jq '.dependency | length')" >> "$GITHUB_OUTPUT"
          echo "target_services=$(echo "$OUT" | jq -c '.target')" >> "$GITHUB_OUTPUT"
          echo "target_count=$(echo "$OUT" | jq '.target | length')" >> "$GITHUB_OUTPUT"
          echo "k6_services=$(echo "$OUT" | jq -c '.k6')" >> "$GITHUB_OUTPUT"
          echo "k6_count=$(echo "$OUT" | jq '.k6 | length')" >> "$GITHUB_OUTPUT"

  route-smoke:
    name: Route smoke (${{ matrix.service }}, ${{ matrix.mode }})
    needs: [validate-shell, prepare-matrices]
    if: github.event_name == 'workflow_dispatch' && needs.prepare-matrices.outputs.route_count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.prepare-matrices.outputs.route_services) }}
        mode: [canary, preview]
    steps:
      - uses: actions/checkout@v4

      - name: Optional /etc/hosts for route_host
        if: ${{ github.event.inputs.route_ip != '' }}
        run: |
          set -euo pipefail
          echo "${{ github.event.inputs.route_ip }} ${{ github.event.inputs.route_host }}" | sudo tee -a /etc/hosts

      - name: Route smoke
        run: |
          set -euo pipefail
          chmod +x tests/route-smoke-test/run.sh
          case "${{ matrix.service }}" in
            product) PREFIX=/api/v1/products ;;
            inventory) PREFIX=/api/v1/inventory ;;
            order) PREFIX=/api/v1/orders ;;
            payment) PREFIX=/api/v1/payments ;;
            noti) PREFIX=/api/v1/notifications ;;
            *) echo "unknown service"; exit 1 ;;
          esac
          tests/route-smoke-test/run.sh "${{ github.event.inputs.route_host }}" "$PREFIX" "${{ matrix.mode }}"

  business-smoke:
    name: Business smoke (${{ matrix.service }})
    needs: [validate-shell, prepare-matrices]
    if: github.event_name == 'workflow_dispatch' && needs.prepare-matrices.outputs.business_count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.prepare-matrices.outputs.business_services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Business smoke
        run: |
          set -euo pipefail
          chmod +x tests/business-smoke/run.sh
          tests/business-smoke/run.sh "${{ matrix.service }}" "${{ github.event.inputs.backend_host }}"

  dependency-check:
    name: Dependency check (${{ matrix.service }})
    needs: [validate-shell, prepare-matrices]
    if: github.event_name == 'workflow_dispatch' && needs.prepare-matrices.outputs.dependency_count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.prepare-matrices.outputs.dependency_services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependency check
        run: |
          set -euo pipefail
          chmod +x tests/dependency-check/run.sh
          tests/dependency-check/run.sh "${{ matrix.service }}" "${{ github.event.inputs.backend_host }}"

  target-smoke:
    name: Target smoke (${{ matrix.service }})
    needs: [validate-shell, prepare-matrices]
    if: github.event_name == 'workflow_dispatch' && needs.prepare-matrices.outputs.target_count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.prepare-matrices.outputs.target_services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Target smoke (pod/service trực tiếp)
        run: |
          set -euo pipefail
          chmod +x tests/target-smoke-test/run.sh
          tests/target-smoke-test/run.sh "${{ matrix.service }}" "${{ github.event.inputs.backend_host }}"

  k6-load:
    name: k6 load (${{ matrix.service }})
    needs: [validate-shell, prepare-matrices]
    if: github.event_name == 'workflow_dispatch' && needs.prepare-matrices.outputs.k6_count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.prepare-matrices.outputs.k6_services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Run k6
        run: |
          set -euo pipefail
          docker run --rm \
            -e SERVICE_NAME="${{ matrix.service }}" \
            -e TARGET_URL="${{ github.event.inputs.backend_host }}" \
            -e VUS="${{ github.event.inputs.k6_vus }}" \
            -e DURATION="${{ github.event.inputs.k6_duration }}" \
            -e ERROR_RATE="${{ github.event.inputs.k6_error_rate }}" \
            -v "${GITHUB_WORKSPACE}/tests/load-test:/scripts:ro" \
            grafana/k6:latest run /scripts/k6-script.js
