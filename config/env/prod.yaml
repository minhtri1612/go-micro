env: prod
projectName: go-micro

routing:
  provider: traefik

traefik:
  enabled: true
  hostname: go-micro.local
  stableWeight: 99
  canaryWeight: 1

ciliumNetworkPolicy:
  enabled: false
  authenticationMode: ""

rollout:
  enabled: true
  strategy: canary
  analysis:
    enabled: true
    prometheusAddress: http://172.18.255.45
    load:
      vus: 12
      duration: 60s
      errorRate: 0.02
    thresholds:
      latencyP95: 0.2
      latencyCount: 10
      latencyFailureLimit: 1
      successRate: 0.95
      successCount: 10
      successInitialDelay: 60s
      successFailureLimit: 1
  canary:
    steps:
      - setWeight: 5
      - analysis:
          templates:
            - templateName: '{{ include "template.fullname" . }}-route-smoke-test'
          args:
            - name: service-name
              value: '{{ include "template.fullname" . }}'
            - name: service-port
              value: '{{ .Values.service.port }}'
            - name: hostname
              value: '{{ .Values.traefik.hostname }}'
            - name: path-prefix
              value: '{{ .Values.traefik.pathPrefix | default "" }}'
      - analysis:
          templates:
            - templateName: '{{ include "template.fullname" . }}-business-smoke'
          args:
            - name: service-name
              value: '{{ include "template.fullname" . }}'
            - name: service-target
              value: '{{ include "template.fullname" . }}-canary'
      - analysis:
          templates:
            - templateName: '{{ include "template.fullname" . }}-dependency-check'
          args:
            - name: service-name
              value: '{{ include "template.fullname" . }}'
            - name: service-target
              value: '{{ include "template.fullname" . }}-canary'
      - analysis:
          templates:
            - templateName: '{{ include "template.fullname" . }}-synthetic-load'
          args:
            - name: service-name
              value: '{{ include "template.fullname" . }}'
      # Wave 3: 20% - Prometheus gate 10 phút
      - setWeight: 20
      - pause:
          duration: 10m
      - analysis:
          templates:
            - templateName: '{{ include "template.fullname" . }}-success-rate'
          args:
            - name: service-name
              value: '{{ include "template.fullname" . }}'
      - setWeight: 50
      - pause: {}
      - setWeight: 100

product:
  namespace: microservices-prod
  secrets:
    target:
      name: go-micro-product-secrets
    remoteKey: go-micro/prod/app-credentials

inventory:
  namespace: microservices-prod
  secrets:
    target:
      name: go-micro-inventory-secrets
    remoteKey: go-micro/prod/app-credentials

order:
  namespace: microservices-prod
  secrets:
    target:
      name: go-micro-order-secrets
    remoteKey: go-micro/prod/app-credentials

noti:
  namespace: microservices-prod
  secrets:
    target:
      name: go-micro-noti-secrets
    remoteKey: go-micro/prod/app-credentials

payment:
  namespace: microservices-prod
  secrets:
    target:
      name: go-micro-payment-secrets
    remoteKey: go-micro/prod/app-credentials

client:
  rollout:
    analysis:
      thresholds:
        # Frontend client uses different telemetry than gin-based backend services.
        successRate: 0
        successFailureLimit: 1

podMonitor:
  enabled: true
  interval: 15s
  release: monitoring-management
