env: dev
projectName: go-micro

routing:
  provider: gateway

# GatewayClass + Gateway: cùng chart `template` (app Argo `gateway-infra-*`, argocd/helm/gateway-infra-*.yaml)
httpRoute:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: go-micro-gateway
      namespace: microservices-dev
      sectionName: http
  hostnames:
    - dev-go-micro.local

ciliumNetworkPolicy:
  enabled: false
  authenticationMode: ""

rollout:
  enabled: true
  strategy: canary
  analysis:
    enabled: false
    # Khi bật analysis: URL Prometheus management (nội bộ/VPC), không dùng lab Kind
    prometheusAddress: ""
    load:
      vus: 10
      duration: 30s
      errorRate: 0.1
    thresholds:
      latencyP95: 1.0
      latencyCount: 3
      latencyFailureLimit: 1
      successRate: 0.82
      successCount: 5
      successInitialDelay: 45s
      successFailureLimit: 3
  canary:
    # Không chạy Analysis trong cluster; test ở pipeline ngoài rồi promote thủ công/qua pipeline.
    steps:
      - setWeight: 5
      - pause:
          duration: 1m
      - setWeight: 50
      - pause: {}
      - setWeight: 100

product:
  namespace: microservices-dev
  secrets:
    target:
      name: go-micro-product-secrets-dev
    remoteKey: go-micro/dev/app-credentials

inventory:
  namespace: microservices-dev
  secrets:
    target:
      name: go-micro-inventory-secrets-dev
    remoteKey: go-micro/dev/app-credentials

order:
  namespace: microservices-dev
  secrets:
    target:
      name: go-micro-order-secrets-dev
    remoteKey: go-micro/dev/app-credentials

noti:
  namespace: microservices-dev
  secrets:
    target:
      name: go-micro-noti-secrets-dev
    remoteKey: go-micro/dev/app-credentials

payment:
  namespace: microservices-dev
  secrets:
    target:
      name: go-micro-payment-secrets-dev
    remoteKey: go-micro/dev/app-credentials

client:
  rollout:
    analysis:
      thresholds:
        # Frontend client does not expose gin_request_* metrics like Go backend services.
        # Keep canary checks focused on smoke/dependency/k6 in dev.
        successRate: 0
        successFailureLimit: 1

podMonitor:
  enabled: true
  interval: 15s
  release: monitoring-management # Quan trọng: Phải khớp với release name của Prometheus Operator
