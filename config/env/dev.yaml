env: dev
projectName: go-micro

routing:
  provider: traefik

traefik:
  enabled: true
  hostname: dev.go-micro.local
  stableWeight: 90
  canaryWeight: 10
  darkLaunch: true   # QA/Dev dùng header X-Canary: true để test canary trực tiếp

ciliumNetworkPolicy:
  enabled: false
  authenticationMode: ""

rollout:
  enabled: true
  analysis:
    enabled: true
    prometheusAddress: http://10.221.72.180
    templates:
      # Gate 1: Smoke Test - Job curl health endpoint, fail fast if 5xx
      - name: smoke-test
        args:
          - name: service-name
        metrics:
          - name: health-check
            count: 1
            failureLimit: 0
            provider:
              job:
                spec:
                  backoffLimit: 0
                  template:
                    spec:
                      restartPolicy: Never
                      containers:
                        - name: smoke
                          image: curlimages/curl:8.5.0
                          command:
                            - sh
                            - -c
                            - |
                              set -e
                              SVC="{{ "{{" }}args.service-name{{ "}}" }}"
                              echo "=== Smoke Test: $SVC ==="
                              STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://$SVC/products 2>/dev/null || echo "000")
                              if [ "$STATUS" = "000" ]; then
                                echo "FAILED: Cannot reach $SVC"
                                exit 1
                              fi
                              if [ "$STATUS" -ge 500 ]; then
                                echo "FAILED: $SVC returned HTTP $STATUS"
                                exit 1
                              fi
                              echo "PASSED: $SVC returned HTTP $STATUS"

      # Gate 2: Synthetic Load - k6 warm-up + Prometheus Latency validation
      # Dev: 10 VUs, P95 < 500ms
      - name: synthetic-load
        args:
          - name: service-name
        metrics:
          # 2.1. k6 thợ xem (Load Generator)
          - name: load-generator-k6
            count: 1
            failureLimit: 0
            provider:
              job:
                spec:
                  backoffLimit: 0
                  template:
                    spec:
                      restartPolicy: Never
                      containers:
                        - name: k6
                          image: grafana/k6:latest
                          command: ["sh", "-c"]
                          args:
                            - |
                              cat <<EOF | k6 run -
                              import http from 'k6/http';
                              import { check, sleep } from 'k6';
                              export const options = {
                                vus: 10,
                                duration: '30s',
                                thresholds: {
                                  http_req_failed: ['rate<0.1'],
                                },
                              };
                              export default function () {
                                let res = http.get('http://{{ "{{" }}args.service-name{{ "}}" }}-canary:8080/products');
                                check(res, { 'status is 200': (r) => r.status === 200 });
                                sleep(0.5);
                              }
                              EOF
          # 2.2. Giám sát viên Prometheus (Check P95 Latency lúc đang load)
          - name: latency-p95-check
            interval: 10s
            count: 3
            initialDelay: 10s
            failureLimit: 0
            successCondition: result[0] < 0.5  # Dev: P95 < 500ms
            provider:
              prometheus:
                address: '{{ .Values.rollout.analysis.prometheusAddress | default "http://10.221.72.180" }}'
                query: |
                  histogram_quantile(0.95, sum(rate(gin_http_request_duration_seconds_bucket{pod=~'{{ "{{" }}args.service-name{{ "}}" }}-.*'}[1m])) by (le))

      # Gate 3: Success Rate - HTTP error rate thật từ gin-metrics
      - name: success-rate
        args:
          - name: service-name
        metrics:
          - name: success-rate
            interval: 30s
            count: 5
            initialDelay: 45s
            failureLimit: 3
            successCondition: result[0] >= 0.82
            failureCondition: result[0] < 0.82
            provider:
              prometheus:
                address: '{{ .Values.rollout.analysis.prometheusAddress | default "http://10.221.72.180" }}'
                query: |
                  (
                    1 - (
                      sum(rate(gin_http_request_total{pod=~"{{ "{{" }}args.service-name{{ "}}" }}-.*",code=~"5.."}[2m])) or vector(0)
                      /
                      (sum(rate(gin_http_request_total{pod=~"{{ "{{" }}args.service-name{{ "}}" }}-.*"}[2m])) or vector(1))
                    )
                  ) or vector(1)
  strategy: canary
  canary:
    steps:
      # Wave 1: 5% - Smoke test nhanh, fail ngay nếu service không start được
      - setWeight: 5
      - analysis:
          templates:
            - templateName: '{{ include "template.fullname" . }}-smoke-test'
          args:
            - name: service-name
              value: '{{ include "template.fullname" . }}'
      # Wave 2: Synthetic load - warm up + tạo Prometheus data
      - analysis:
          templates:
            - templateName: '{{ include "template.fullname" . }}-synthetic-load'
          args:
            - name: service-name
              value: '{{ include "template.fullname" . }}'
      # Wave 3: 20% - Mở rộng, chờ traffic thật rồi check Prometheus
      - setWeight: 20
      - pause:
          duration: 3m
      - analysis:
          templates:
            - templateName: '{{ include "template.fullname" . }}-success-rate'
          args:
            - name: service-name
              value: '{{ include "template.fullname" . }}'
      # Wave 4: Promote
      - setWeight: 50
      - setWeight: 100
  blueGreen:
    activeService: ""
    previewService: ""
    autoPromotionEnabled: true
    scaleDownDelaySeconds: 30

product:
  namespace: microservices-dev
  secrets:
    target:
      name: go-micro-product-secrets-dev
    remoteKey: go-micro/dev/app-credentials

inventory:
  namespace: microservices-dev
  secrets:
    target:
      name: go-micro-inventory-secrets-dev
    remoteKey: go-micro/dev/app-credentials

order:
  namespace: microservices-dev
  secrets:
    target:
      name: go-micro-order-secrets-dev
    remoteKey: go-micro/dev/app-credentials

noti:
  namespace: microservices-dev
  secrets:
    target:
      name: go-micro-noti-secrets-dev
    remoteKey: go-micro/dev/app-credentials

payment:
  namespace: microservices-dev
  secrets:
    target:
      name: go-micro-payment-secrets-dev
    remoteKey: go-micro/dev/app-credentials
