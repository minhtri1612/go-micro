projectName: go-micro
secretStoreName: aws-secrets-manager
region: ap-southeast-2

product:
  namespace: microservices
  syncWave: "-2"
  secrets:
    refreshInterval: 1h
    data:
      - secretKey: DB_USER
        remoteRef:
          property: DB_USER
      - secretKey: DB_PASSWORD
        remoteRef:
          property: DB_PASSWORD
      - secretKey: DB_NAME
        remoteRef:
          property: PRODUCT_DB_NAME

inventory:
  namespace: microservices
  syncWave: "-2"
  secrets:
    refreshInterval: 1h
    data:
      - secretKey: DB_USER
        remoteRef:
          property: DB_USER
      - secretKey: DB_PASSWORD
        remoteRef:
          property: DB_PASSWORD
      - secretKey: DB_NAME
        remoteRef:
          property: INVENTORY_DB_NAME

order:
  namespace: microservices
  syncWave: "-2"
  secrets:
    refreshInterval: 1h
    data:
      - secretKey: DB_USER
        remoteRef:
          property: DB_USER
      - secretKey: DB_PASSWORD
        remoteRef:
          property: DB_PASSWORD
      - secretKey: DB_NAME
        remoteRef:
          property: ORDER_DB_NAME

noti:
  namespace: microservices
  syncWave: "-2"
  secrets:
    refreshInterval: 1h
    data:
      - secretKey: DB_USER
        remoteRef:
          property: DB_USER
      - secretKey: DB_PASSWORD
        remoteRef:
          property: DB_PASSWORD
      - secretKey: DB_NAME
        remoteRef:
          property: NOTIFICATION_DB_NAME

payment:
  namespace: microservices
  syncWave: "-2"
  secrets:
    refreshInterval: 1h
    data:
      - secretKey: DB_USER
        remoteRef:
          property: DB_USER
      - secretKey: DB_PASSWORD
        remoteRef:
          property: DB_PASSWORD
      - secretKey: DB_NAME
        remoteRef:
          property: PAYMENT_DB_NAME
      - secretKey: STRIPE_SECRET_KEY
        remoteRef:
          property: STRIPE_SECRET_KEY

rollout:
  enabled: true
  strategy: canary
  analysis:
    enabled: true
    prometheusAddress: http://172.18.255.45
    load:
      vus: 10
      duration: 30s
      errorRate: 0.1
    thresholds:
      latencyP95: 0.5
      latencyCount: 3
      latencyFailureLimit: 0
      successRate: 0.82
      successCount: 5
      successInitialDelay: 45s
      successFailureLimit: 3
    templates:
      - name: route-smoke-test
        args:
          - name: service-name
          - name: service-port
          - name: hostname
          - name: path-prefix
        metrics:
          - name: health-check
            count: 1
            failureLimit: 0
            provider:
              job:
                spec:
                  backoffLimit: 0
                  template:
                    spec:
                      restartPolicy: Never
                      containers:
                        - name: smoke
                          image: curlimages/curl:8.5.0
                          command:
                            - sh
                            - -c
                            - |
                              set -e
                              GATEWAY="traefik.traefik.svc.cluster.local"
                              HOST="{{ `{{` }}args.hostname{{ `}}` }}"
                              PREFIX="{{ `{{` }}args.path-prefix{{ `}}` }}"
                              RESPONSE=$(curl -i -s -X GET -H "Host: $HOST" -H "X-Canary: true" http://$GATEWAY$PREFIX/health)
                              HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP/" | awk '{print $2}')
                              if [ "$HTTP_CODE" != "200" ]; then
                                echo "FAILED: health returned $HTTP_CODE"
                                exit 1
                              fi
                              SERVED_BY=$(echo "$RESPONSE" | grep -i "X-Served-By" | awk '{print $2}' | tr -d '\r')
                              if [ "$SERVED_BY" != "canary" ]; then
                                echo "FAILED: request was not served by canary ($SERVED_BY)"
                                exit 1
                              fi
                              echo "PASSED: route gate"
      - name: preview-route-smoke-test
        args:
          - name: service-name
          - name: service-port
          - name: hostname
          - name: path-prefix
        metrics:
          - name: health-check
            count: 1
            failureLimit: 0
            provider:
              job:
                spec:
                  backoffLimit: 0
                  template:
                    spec:
                      restartPolicy: Never
                      containers:
                        - name: smoke
                          image: curlimages/curl:8.5.0
                          command:
                            - sh
                            - -c
                            - |
                              set -e
                              GATEWAY="traefik.traefik.svc.cluster.local"
                              HOST="{{ `{{` }}args.hostname{{ `}}` }}"
                              PREFIX="{{ `{{` }}args.path-prefix{{ `}}` }}"
                              RESPONSE=$(curl -i -s -X GET -H "Host: $HOST" -H "X-Preview: true" http://$GATEWAY$PREFIX/health)
                              HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP/" | awk '{print $2}')
                              if [ "$HTTP_CODE" != "200" ]; then
                                echo "FAILED: health returned $HTTP_CODE"
                                exit 1
                              fi
                              SERVED_BY=$(echo "$RESPONSE" | grep -i "X-Served-By" | awk '{print $2}' | tr -d '\r')
                              if [ "$SERVED_BY" != "preview" ]; then
                                echo "FAILED: request was not served by preview ($SERVED_BY)"
                                exit 1
                              fi
                              echo "PASSED: preview route gate"
      - name: target-smoke-test
        args:
          - name: service-name
          - name: service-target
        metrics:
          - name: health-check
            count: 1
            failureLimit: 0
            provider:
              job:
                spec:
                  backoffLimit: 0
                  template:
                    spec:
                      restartPolicy: Never
                      containers:
                        - name: smoke
                          image: curlimages/curl:8.5.0
                          command:
                            - sh
                            - -c
                            - |
                              set -e
                              SERVICE="{{ `{{` }}args.service-name{{ `}}` }}"
                              TARGET="{{ `{{` }}args.service-target{{ `}}` }}"
                              svc_port() {
                                case "$1" in
                                  product) echo 8080 ;;
                                  order) echo 8081 ;;
                                  inventory) echo 8082 ;;
                                  noti) echo 8083 ;;
                                  payment) echo 8084 ;;
                                  client) echo 80 ;;
                                  *) echo 8080 ;;
                                esac
                              }
                              probe_path() {
                                case "$1" in
                                  client) echo "/" ;;
                                  order) echo "/orders" ;;
                                  *) echo "/health" ;;
                                esac
                              }
                              PORT="$(svc_port "$SERVICE")"
                              PATH_PART="$(probe_path "$SERVICE")"
                              URL="http://${TARGET}:${PORT}${PATH_PART}"
                              HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" "$URL")
                              if [ "$HTTP_CODE" != "200" ]; then
                                echo "FAILED: target health returned $HTTP_CODE at $URL"
                                exit 1
                              fi
                              echo "PASSED: target smoke ($URL)"
      - name: business-smoke
        args:
          - name: service-name
          - name: service-target
        metrics:
          - name: business-smoke
            count: 1
            failureLimit: 0
            provider:
              job:
                spec:
                  backoffLimit: 0
                  template:
                    spec:
                      restartPolicy: Never
                      containers:
                        - name: business-smoke
                          image: curlimages/curl:8.5.0
                          command:
                            - sh
                            - -c
                            - |
                              set -e
                              SERVICE="{{ `{{` }}args.service-name{{ `}}` }}"
                              TARGET="{{ `{{` }}args.service-target{{ `}}` }}"
                              svc_port() {
                                case "$1" in
                                  product) echo 8080 ;;
                                  order) echo 8081 ;;
                                  inventory) echo 8082 ;;
                                  noti) echo 8083 ;;
                                  payment) echo 8084 ;;
                                  client) echo 80 ;;
                                  *) echo 8080 ;;
                                esac
                              }
                              curl_retry() {
                                local url="$1"
                                local method="${2:-GET}"
                                local body="${3:-}"
                                local tries=0
                                while [ $tries -lt 10 ]; do
                                  if [ -n "$body" ]; then
                                    RESP=$(curl -sS -X "$method" "$url" -H "Content-Type: application/json" -d "$body") && { echo "$RESP"; return 0; }
                                  else
                                    RESP=$(curl -sS -X "$method" "$url") && { echo "$RESP"; return 0; }
                                  fi
                                  tries=$((tries+1))
                                  sleep 3
                                done
                                return 1
                              }

                              fail() { echo "[FAIL] $1"; echo "[RAW ] $2"; exit 1; }
                              assert_field() {
                                local label="$1" value="$2" body="$3"
                                [ -n "$value" ] || fail "$label missing or empty" "$body"
                              }
                              assert_contains() {
                                local label="$1" pattern="$2" body="$3"
                                echo "$body" | grep -qF "$pattern" || fail "$label not found (expected '$pattern')" "$body"
                              }
                              assert_any_contains() {
                                local label="$1" body="$2"; shift 2
                                local ok=1
                                for p in "$@"; do
                                  if echo "$body" | grep -qF "$p"; then
                                    ok=0
                                    break
                                  fi
                                done
                                [ $ok -eq 0 ] || fail "$label none matched: $*" "$body"
                              }

                              case "$SERVICE" in
                                product)
                                  BASE="http://${TARGET}:$(svc_port "$SERVICE")"
                                  NAME="canary-smoke-${RANDOM}"
                                  CREATE_BODY=$(curl_retry "$BASE/products" "POST" "{\"name\":\"$NAME\",\"description\":\"canary-smoke\",\"price\":11.11}")
                                  echo "[DBG] product create: $CREATE_BODY"
                                  PRODUCT_ID=$(echo "$CREATE_BODY" | sed -n 's/.*"id":[[:space:]]*\([0-9][0-9]*\).*/\1/p')
                                  assert_field "product.id" "$PRODUCT_ID" "$CREATE_BODY"
                                  assert_contains "product.name" "$NAME" "$CREATE_BODY"
                                  assert_contains "product.price" "11.11" "$CREATE_BODY"
                                  GET_BODY=$(curl_retry "$BASE/products/$PRODUCT_ID")
                                  echo "[DBG] product get: $GET_BODY"
                                  assert_contains "product.get.id" "\"id\":$PRODUCT_ID" "$GET_BODY"
                                  ;;
                                inventory)
                                  BASE="http://${TARGET}:$(svc_port "$SERVICE")"
                                  PID=$((1000 + RANDOM % 9000))
                                  CREATE_BODY=$(curl -sS -X POST "$BASE/inventory" -H "Content-Type: application/json" -d "{\"product_id\":$PID,\"quantity\":20,\"sku\":\"SKU-$PID\",\"location\":\"A1\"}")
                                  echo "[DBG] inventory create: $CREATE_BODY"
                                  INV_ID=$(echo "$CREATE_BODY" | sed -n 's/.*"id":[[:space:]]*\([0-9][0-9]*\).*/\1/p')
                                  assert_field "inventory.id" "$INV_ID" "$CREATE_BODY"
                                  assert_contains "inventory.quantity" "\"quantity\":20" "$CREATE_BODY"
                                  assert_contains "inventory.sku" "SKU-$PID" "$CREATE_BODY"
                                  ;;
                                order)
                                  P_BASE="http://product:$(svc_port product)"
                                  I_BASE="http://inventory:$(svc_port inventory)"
                                  O_BASE="http://${TARGET}:$(svc_port "$SERVICE")"
                                  PID=$(( $(date +%s) + RANDOM ))
                                  P_CREATE=$(curl_retry "$P_BASE/products" "POST" "{\"name\":\"order-pre-$PID\",\"description\":\"seed\",\"price\":15.5}")
                                  echo "[DBG] order seed product: $P_CREATE"
                                  REAL_PID=$(echo "$P_CREATE" | sed -n 's/.*"id":[[:space:]]*\([0-9][0-9]*\).*/\1/p')
                                  assert_field "order.seed_product_id" "$REAL_PID" "$P_CREATE"
                                  curl_retry "$I_BASE/inventory" "POST" "{\"product_id\":$REAL_PID,\"quantity\":30,\"sku\":\"OSKU-$PID\",\"location\":\"B2\"}" >/dev/null
                                  ORDER_BODY=$(curl_retry "$O_BASE/orders" "POST" "{\"customer_id\":1,\"product_id\":$REAL_PID,\"quantity\":1,\"total_price\":15.5}")
                                  echo "[DBG] order create: $ORDER_BODY"
                                  ORDER_ID=$(echo "$ORDER_BODY" | sed -n 's/.*"id":[[:space:]]*\([0-9][0-9]*\).*/\1/p')
                                  assert_field "order.id" "$ORDER_ID" "$ORDER_BODY"
                                  assert_contains "order.customer_id" "\"customer_id\":1" "$ORDER_BODY"
                                  assert_contains "order.product_id" "\"product_id\":$REAL_PID" "$ORDER_BODY"
                                  ;;
                                payment)
                                  BASE="http://${TARGET}:$(svc_port "$SERVICE")"
                                  PAY_BODY=$(curl_retry "$BASE/payments/" "POST" '{"order_id":9001,"customer_id":1,"amount":10.5,"currency":"usd"}')
                                  echo "[DBG] payment create: $PAY_BODY"
                                  assert_contains "payment.key" "\"payment\"" "$PAY_BODY"
                                  assert_contains "payment.amount" "10.5" "$PAY_BODY"
                                  assert_contains "payment.currency" "usd" "$PAY_BODY"
                                  ;;
                                noti)
                                  BASE="http://${TARGET}:$(svc_port "$SERVICE")"
                                  NOTI_BODY=$(curl -sS -X POST "$BASE/notifications" -H "Content-Type: application/json" -d '{"order_id":9001,"customer_id":1,"message":"canary smoke","status":"pending"}')
                                  echo "[DBG] noti create: $NOTI_BODY"
                                  NOTI_ID=$(echo "$NOTI_BODY" | sed -n 's/.*"id":[[:space:]]*\([0-9][0-9]*\).*/\1/p')
                                  assert_field "noti.id" "$NOTI_ID" "$NOTI_BODY"
                                  assert_contains "noti.status" "pending" "$NOTI_BODY"
                                  assert_contains "noti.order_id" "9001" "$NOTI_BODY"
                                  ;;
                                *)
                                  echo "SKIP: no business-smoke profile for $SERVICE"
                                  ;;
                              esac
                              echo "PASSED: business smoke for $SERVICE"
      - name: dependency-check
        args:
          - name: service-name
          - name: service-target
        metrics:
          - name: dependency-check
            count: 1
            failureLimit: 0
            provider:
              job:
                spec:
                  backoffLimit: 0
                  template:
                    spec:
                      restartPolicy: Never
                      containers:
                        - name: dependency-check
                          image: curlimages/curl:8.5.0
                          command:
                            - sh
                            - -c
                            - |
                              set -e
                              SERVICE="{{ `{{` }}args.service-name{{ `}}` }}"
                              TARGET="{{ `{{` }}args.service-target{{ `}}` }}"
                              svc_port() {
                                case "$1" in
                                  product) echo 8080 ;;
                                  order) echo 8081 ;;
                                  inventory) echo 8082 ;;
                                  noti) echo 8083 ;;
                                  payment) echo 8084 ;;
                                  client) echo 80 ;;
                                  *) echo 8080 ;;
                                esac
                              }
                              curl_retry() {
                                local url="$1"
                                local method="${2:-GET}"
                                local body="${3:-}"
                                local tries=0
                                while [ $tries -lt 10 ]; do
                                  if [ -n "$body" ]; then
                                    RESP=$(curl -sS -X "$method" "$url" -H "Content-Type: application/json" -d "$body") && { echo "$RESP"; return 0; }
                                  else
                                    RESP=$(curl -sS -X "$method" "$url") && { echo "$RESP"; return 0; }
                                  fi
                                  tries=$((tries+1))
                                  sleep 3
                                done
                                return 1
                              }

                              fail() { echo "[FAIL] $1"; echo "[RAW ] $2"; exit 1; }
                              assert_field() {
                                local label="$1" value="$2" body="$3"
                                [ -n "$value" ] || fail "$label missing or empty" "$body"
                              }
                              assert_contains() {
                                local label="$1" pattern="$2" body="$3"
                                echo "$body" | grep -qF "$pattern" || fail "$label not found (expected '$pattern')" "$body"
                              }

                              case "$SERVICE" in
                                product)
                                  BASE="http://${TARGET}:$(svc_port "$SERVICE")"

                                  # 1. GET /products — list phải là JSON array
                                  LIST_BODY=$(curl_retry "$BASE/products")
                                  echo "[DBG] product list: $LIST_BODY"
                                  echo "$LIST_BODY" | grep -qE '^\[' || fail "product.list not a JSON array" "$LIST_BODY"

                                  # 2. POST /products — tạo mới để test CRUD
                                  PNAME="dep-prod-${RANDOM}"
                                  CREATE_BODY=$(curl_retry "$BASE/products" "POST" "{\"name\":\"$PNAME\",\"description\":\"dep-check\",\"price\":55.5}")
                                  echo "[DBG] product dep create: $CREATE_BODY"
                                  PROD_ID=$(echo "$CREATE_BODY" | sed -n 's/.*"id":[[:space:]]*\([0-9][0-9]*\).*/\1/p')
                                  assert_field "product.dep.id" "$PROD_ID" "$CREATE_BODY"

                                  # 3. GET /products/:id
                                  GET_BODY=$(curl_retry "$BASE/products/$PROD_ID")
                                  echo "[DBG] product dep get: $GET_BODY"
                                  assert_contains "product.dep.get.id" "\"id\":$PROD_ID" "$GET_BODY"
                                  assert_contains "product.dep.get.price" "55.5" "$GET_BODY"

                                  # 4. PUT /products/:id — update price
                                  PUT_BODY=$(curl_retry "$BASE/products/$PROD_ID" "PUT" "{\"name\":\"$PNAME-upd\",\"description\":\"updated\",\"price\":77.7}")
                                  echo "[DBG] product dep put: $PUT_BODY"
                                  assert_contains "product.dep.put.id" "\"id\":$PROD_ID" "$PUT_BODY"
                                  assert_contains "product.dep.put.price" "77.7" "$PUT_BODY"

                                  # 5. DELETE /products/:id
                                  DEL_BODY=$(curl_retry "$BASE/products/$PROD_ID" "DELETE")
                                  echo "[DBG] product dep delete: $DEL_BODY"
                                  assert_contains "product.dep.delete" "deleted successfully" "$DEL_BODY"
                                  ;;
                                inventory)
                                  BASE="http://${TARGET}:$(svc_port "$SERVICE")"
                                  PID=$((3000 + RANDOM % 9000))

                                  # 1. POST /inventory — tạo mới
                                  CREATE_BODY=$(curl -sS -X POST "$BASE/inventory" -H "Content-Type: application/json" -d "{\"product_id\":$PID,\"quantity\":9,\"sku\":\"DSKU-$PID\",\"location\":\"C3\"}")
                                  echo "[DBG] inventory dep create: $CREATE_BODY"
                                  INV_ID=$(echo "$CREATE_BODY" | sed -n 's/.*"id":[[:space:]]*\([0-9][0-9]*\).*/\1/p')
                                  assert_field "inventory.dep.id" "$INV_ID" "$CREATE_BODY"
                                  assert_contains "inventory.dep.quantity" "\"quantity\":9" "$CREATE_BODY"
                                  assert_contains "inventory.dep.sku" "DSKU-$PID" "$CREATE_BODY"

                                  # 2. GET /inventory/:id
                                  GET_BODY=$(curl -sS "$BASE/inventory/$INV_ID")
                                  echo "[DBG] inventory dep get: $GET_BODY"
                                  assert_contains "inventory.dep.get.id" "\"id\":$INV_ID" "$GET_BODY"
                                  assert_contains "inventory.dep.get.location" "C3" "$GET_BODY"

                                  # 3. POST /inventory/check — available (qty=9 >= 1)
                                  CHECK_OK=$(curl -sS -X POST "$BASE/inventory/check" -H "Content-Type: application/json" -d "{\"product_id\":$PID,\"quantity\":1}")
                                  echo "[DBG] inventory dep check ok: $CHECK_OK"
                                  assert_contains "inventory.dep.check.available" "\"available\":true" "$CHECK_OK"

                                  # 4. POST /inventory/check — not available (qty=9 < 999)
                                  CHECK_FAIL=$(curl -sS -X POST "$BASE/inventory/check" -H "Content-Type: application/json" -d "{\"product_id\":$PID,\"quantity\":999}")
                                  echo "[DBG] inventory dep check fail: $CHECK_FAIL"
                                  assert_contains "inventory.dep.check.not_available" "\"available\":false" "$CHECK_FAIL"

                                  # 5. PUT /inventory/:id — update quantity
                                  PUT_BODY=$(curl -sS -X PUT "$BASE/inventory/$INV_ID" -H "Content-Type: application/json" -d "{\"product_id\":$PID,\"quantity\":50,\"sku\":\"DSKU-$PID-upd\",\"location\":\"Z9\"}")
                                  echo "[DBG] inventory dep put: $PUT_BODY"
                                  assert_contains "inventory.dep.put.quantity" "\"quantity\":50" "$PUT_BODY"
                                  assert_contains "inventory.dep.put.location" "Z9" "$PUT_BODY"

                                  # 6. DELETE /inventory/:id
                                  DEL_BODY=$(curl -sS -X DELETE "$BASE/inventory/$INV_ID")
                                  echo "[DBG] inventory dep delete: $DEL_BODY"
                                  assert_contains "inventory.dep.delete" "deleted successfully" "$DEL_BODY"
                                  ;;
                                order)
                                  P_BASE="http://product:$(svc_port product)"
                                  I_BASE="http://inventory:$(svc_port inventory)"
                                  O_BASE="http://${TARGET}:$(svc_port "$SERVICE")"
                                  PID=$(( $(date +%s) + RANDOM ))

                                  # 1. Seed: tạo product + inventory (quantity=25)
                                  P_CREATE=$(curl_retry "$P_BASE/products" "POST" "{\"name\":\"dep-pre-$PID\",\"description\":\"seed\",\"price\":21.5}")
                                  echo "[DBG] order dep seed product: $P_CREATE"
                                  REAL_PID=$(echo "$P_CREATE" | sed -n 's/.*\"id\":[[:space:]]*\([0-9][0-9]*\).*/\1/p')
                                  assert_field "order.dep.seed_product_id" "$REAL_PID" "$P_CREATE"
                                  curl_retry "$I_BASE/inventory" "POST" "{\"product_id\":$REAL_PID,\"quantity\":25,\"sku\":\"ODSKU-$PID\",\"location\":\"D4\"}" >/dev/null

                                  # 2. Test: inventory check FAIL (quantity=99999 > 25 available)
                                  INV_FAIL_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$O_BASE/orders" \
                                    -H "Content-Type: application/json" \
                                    -d "{\"customer_id\":1,\"product_id\":$REAL_PID,\"quantity\":99999,\"total_price\":99.9}")
                                  [ "$INV_FAIL_STATUS" = "400" ] || fail "order.dep.inv_check_fail expected HTTP 400, got $INV_FAIL_STATUS" "inventory should reject qty=99999"
                                  echo "[DBG] order dep inv_check_fail: HTTP $INV_FAIL_STATUS (expected 400) OK"

                                  # 3. POST /orders — tạo order hợp lệ
                                  ORDER_BODY=$(curl_retry "$O_BASE/orders" "POST" "{\"customer_id\":1,\"product_id\":$REAL_PID,\"quantity\":1,\"total_price\":21.5}")
                                  echo "[DBG] order dep create: $ORDER_BODY"
                                  ORDER_ID=$(echo "$ORDER_BODY" | sed -n 's/.*\"id\":[[:space:]]*\([0-9][0-9]*\).*/\1/p')
                                  assert_field "order.dep.id" "$ORDER_ID" "$ORDER_BODY"
                                  assert_contains "order.dep.total_price" "21.5" "$ORDER_BODY"
                                  assert_contains "order.dep.status" "\"status\":\"pending\"" "$ORDER_BODY"

                                  # 4. GET /orders — list phải chứa order vừa tạo
                                  ORDER_LIST=$(curl_retry "$O_BASE/orders")
                                  echo "[DBG] order dep list: $ORDER_LIST"
                                  assert_contains "order.dep.list.id" "\"id\":$ORDER_ID" "$ORDER_LIST"

                                  # 5. GET /orders/:id — lấy đúng order theo ID
                                  GET_BODY=$(curl -sS "$O_BASE/orders/$ORDER_ID")
                                  echo "[DBG] order dep get: $GET_BODY"
                                  assert_contains "order.dep.get.id" "\"id\":$ORDER_ID" "$GET_BODY"
                                  assert_contains "order.dep.get.customer_id" "\"customer_id\":1" "$GET_BODY"
                                  assert_contains "order.dep.get.product_id" "\"product_id\":$REAL_PID" "$GET_BODY"

                                  # 6. PATCH /orders/:id/status — đổi status sang processing
                                  PATCH_BODY=$(curl -sS -X PATCH "$O_BASE/orders/$ORDER_ID/status" \
                                    -H "Content-Type: application/json" -d '{"status":"processing"}')
                                  echo "[DBG] order dep patch status: $PATCH_BODY"
                                  assert_contains "order.dep.patch.order_id" "\"order_id\":$ORDER_ID" "$PATCH_BODY"
                                  assert_contains "order.dep.patch.status" "\"status\":\"processing\"" "$PATCH_BODY"

                                  # 7. PUT /orders/:id — update quantity và total_price
                                  PUT_BODY=$(curl -sS -X PUT "$O_BASE/orders/$ORDER_ID" \
                                    -H "Content-Type: application/json" \
                                    -d "{\"customer_id\":1,\"product_id\":$REAL_PID,\"quantity\":2,\"total_price\":43.0,\"status\":\"processing\"}")
                                  echo "[DBG] order dep put: $PUT_BODY"
                                  assert_contains "order.dep.put.id" "\"id\":$ORDER_ID" "$PUT_BODY"
                                  assert_contains "order.dep.put.quantity" "\"quantity\":2" "$PUT_BODY"

                                  # 8. POST /orders/with-payment — order path tích hợp payment
                                  WITH_PAY=$(curl -sS -X POST "$O_BASE/orders/with-payment" \
                                    -H "Content-Type: application/json" \
                                    -d "{\"customer_id\":1,\"product_id\":$REAL_PID,\"quantity\":1,\"total_price\":21.5,\"currency\":\"usd\"}")
                                  echo "[DBG] order dep with-payment: $WITH_PAY"
                                  assert_contains "order.dep.with_payment.order" "\"order\"" "$WITH_PAY"
                                  if ! echo "$WITH_PAY" | grep -qF "\"payment\"" && ! echo "$WITH_PAY" | grep -qF "\"payment_error\""; then
                                    fail "order.dep.with_payment.result none matched: \"payment\" or \"payment_error\"" "$WITH_PAY"
                                  fi

                                  # 9. POST /orders/batch — xử lý batch tối thiểu
                                  BATCH_BODY=$(curl -sS -X POST "$O_BASE/orders/batch" \
                                    -H "Content-Type: application/json" \
                                    -d "[{\"customer_id\":1,\"product_id\":$REAL_PID,\"quantity\":1,\"total_price\":21.5}]")
                                  echo "[DBG] order dep batch: $BATCH_BODY"
                                  assert_contains "order.dep.batch.total_orders" "\"total_orders\":1" "$BATCH_BODY"
                                  assert_contains "order.dep.batch.successful" "\"successful\":1" "$BATCH_BODY"

                                  # 10. DELETE /orders/:id — xóa order, verify response
                                  DEL_BODY=$(curl -sS -X DELETE "$O_BASE/orders/$ORDER_ID")
                                  echo "[DBG] order dep delete: $DEL_BODY"
                                  assert_contains "order.dep.delete" "deleted successfully" "$DEL_BODY"
                                  ;;
                                payment)
                                  BASE="http://${TARGET}:$(svc_port "$SERVICE")"
                                  PAY_ORDER_ID=$((5000 + RANDOM % 9000))

                                  # 1. POST /payments/ — tạo payment
                                  PAY_CREATE=$(curl -sS -X POST "$BASE/payments/" -H "Content-Type: application/json" -d "{\"order_id\":$PAY_ORDER_ID,\"customer_id\":1,\"amount\":12.34,\"currency\":\"usd\"}")
                                  echo "[DBG] payment dep create: $PAY_CREATE"
                                  PAY_ID=$(echo "$PAY_CREATE" | sed -n 's/.*"id":[[:space:]]*\([0-9][0-9]*\).*/\1/p')
                                  assert_field "payment.dep.id" "$PAY_ID" "$PAY_CREATE"
                                  assert_contains "payment.dep.create.order_id" "\"order_id\":$PAY_ORDER_ID" "$PAY_CREATE"

                                  # 2. GET /payments/order/:orderId
                                  BY_ORDER=$(curl -sS "$BASE/payments/order/$PAY_ORDER_ID")
                                  echo "[DBG] payment dep by_order: $BY_ORDER"
                                  assert_contains "payment.dep.order_id" "\"order_id\":$PAY_ORDER_ID" "$BY_ORDER"
                                  assert_contains "payment.dep.amount" "12.34" "$BY_ORDER"
                                  assert_contains "payment.dep.currency" "usd" "$BY_ORDER"

                                  # 3. GET /payments/:id
                                  BY_ID=$(curl -sS "$BASE/payments/$PAY_ID")
                                  echo "[DBG] payment dep by_id: $BY_ID"
                                  assert_contains "payment.dep.get.id" "\"id\":$PAY_ID" "$BY_ID"
                                  assert_contains "payment.dep.get.amount" "12.34" "$BY_ID"
                                  ;;
                                noti)
                                  BASE="http://${TARGET}:$(svc_port "$SERVICE")"
                                  CUST_ID=$((100 + RANDOM % 900))
                                  ORDER_ID=$((7000 + RANDOM % 1000))

                                  # 1. POST /notifications — tạo mới
                                  CREATE_BODY=$(curl -sS -X POST "$BASE/notifications" -H "Content-Type: application/json" \
                                    -d "{\"order_id\":$ORDER_ID,\"customer_id\":$CUST_ID,\"message\":\"dep check\",\"status\":\"pending\"}")
                                  echo "[DBG] noti dep create: $CREATE_BODY"
                                  NOTI_ID=$(echo "$CREATE_BODY" | sed -n 's/.*"id":[[:space:]]*\([0-9][0-9]*\).*/\1/p')
                                  assert_field "noti.dep.id" "$NOTI_ID" "$CREATE_BODY"
                                  assert_contains "noti.dep.status" "pending" "$CREATE_BODY"
                                  assert_contains "noti.dep.order_id" "\"order_id\":$ORDER_ID" "$CREATE_BODY"

                                  # 2. GET /notifications/:id
                                  GET_BODY=$(curl -sS "$BASE/notifications/$NOTI_ID")
                                  echo "[DBG] noti dep get: $GET_BODY"
                                  assert_contains "noti.dep.get.id" "\"id\":$NOTI_ID" "$GET_BODY"
                                  assert_contains "noti.dep.get.customer_id" "\"customer_id\":$CUST_ID" "$GET_BODY"

                                  # 3. GET /notifications — list
                                  LIST_BODY=$(curl -sS "$BASE/notifications")
                                  echo "[DBG] noti dep list: $LIST_BODY"
                                  assert_contains "noti.dep.list.id" "\"id\":$NOTI_ID" "$LIST_BODY"

                                  # 4. GET /notifications/customer/:customerId
                                  CUST_LIST=$(curl -sS "$BASE/notifications/customer/$CUST_ID")
                                  echo "[DBG] noti dep cust_list: $CUST_LIST"
                                  assert_contains "noti.dep.cust.id" "\"id\":$NOTI_ID" "$CUST_LIST"

                                  # 5. POST /notifications/order-status
                                  OS_BODY=$(curl -sS -X POST "$BASE/notifications/order-status" -H "Content-Type: application/json" \
                                    -d "{\"order_id\":$ORDER_ID,\"customer_id\":$CUST_ID,\"status\":\"processing\"}")
                                  echo "[DBG] noti dep order-status: $OS_BODY"
                                  assert_contains "noti.dep.order_status.message" "Order status notification created" "$OS_BODY"
                                  OS_NID=$(echo "$OS_BODY" | sed -n 's/.*"notification_id":[[:space:]]*\([0-9][0-9]*\).*/\1/p')
                                  assert_field "noti.dep.order_status.notification_id" "$OS_NID" "$OS_BODY"

                                  # 6. PUT /notifications/:id/deliver
                                  DELIVER=$(curl -sS -X PUT "$BASE/notifications/$NOTI_ID/deliver")
                                  echo "[DBG] noti dep deliver: $DELIVER"
                                  assert_contains "noti.dep.deliver" "delivered" "$DELIVER"
                                  ;;
                                *)
                                  echo "SKIP: no dependency profile for $SERVICE"
                                  ;;
                              esac
                              echo "PASSED: dependency check for $SERVICE"
      - name: synthetic-load
        args:
          - name: service-name
          - name: service-target
        metrics:
          - name: load-generator-k6
            count: 1
            failureLimit: 0
            initialDelay: 40s
            provider:
              job:
                spec:
                  backoffLimit: 0
                  template:
                    spec:
                      restartPolicy: Never
                      containers:
                        - name: k6
                          image: grafana/k6:latest
                          command: ["sh", "-c"]
                          args:
                            - |
                              cat <<'EOF' | k6 run -
                              import http from 'k6/http';
                              import { check, sleep } from 'k6';
                              export const options = {
                                vus: {{ .Values.rollout.analysis.load.vus | default 10 }},
                                duration: '{{ .Values.rollout.analysis.load.duration | default "30s" }}',
                                thresholds: {
                                  http_req_failed: ['rate<{{ .Values.rollout.analysis.load.errorRate | default 0.1 }}'],
                                  http_req_duration: ['p(95)<2000'],
                                },
                              };
                              function targetPort(service) {
                                const ports = { product: 8080, order: 8081, inventory: 8082, noti: 8083, payment: 8084, client: 80 };
                                return ports[service] || 8080;
                              }
                              function probePath(service) {
                                if (service === 'client') return '/';
                                if (service === 'order') return '/orders';
                                return '/health';
                              }
                              export default function () {
                                const service = '{{ `{{` }}args.service-name{{ `}}` }}';
                                const target = '{{ `{{` }}args.service-target{{ `}}` }}';
                                const port = targetPort(service);
                                const path = probePath(service);
                                let res = http.get(`http://${target}:${port}${path}`);
                                check(res, { 'status is 200': (r) => r.status === 200 });
                                sleep(0.3);
                              }
                              EOF
          - name: latency-p95-check
            interval: 15s
            count: '{{ .Values.rollout.analysis.thresholds.latencyCount | default 3 }}'
            initialDelay: 70s
            failureLimit: '{{ .Values.rollout.analysis.thresholds.latencyFailureLimit | default 0 }}'
            successCondition: 'result[0] == 999 || result[0] < {{ .Values.rollout.analysis.thresholds.latencyP95 | default 0.5 }}'
            provider:
              prometheus:
                address: '{{ .Values.rollout.analysis.prometheusAddress | default "http://172.18.255.45" }}'
                query: |
                  (
                    histogram_quantile(0.95, sum(increase(gin_request_duration_bucket{pod=~'{{ `{{` }}args.service-name{{ `}}` }}-.*'}[5m])) by (le))
                    unless
                    sum(increase(gin_request_duration_count{pod=~'{{ `{{` }}args.service-name{{ `}}` }}-.*'}[5m])) < 1
                  ) or vector(999)
      - name: success-rate
        args:
          - name: service-name
        metrics:
          - name: success-rate
            interval: 30s
            count: 5
            initialDelay: '45s'
            failureLimit: 3
            successCondition: 'result[0] >= {{ .Values.rollout.analysis.thresholds.successRate | default 0.82 }}'
            failureCondition: 'result[0] < {{ .Values.rollout.analysis.thresholds.successRate | default 0.82 }}'
            provider:
              prometheus:
                address: '{{ .Values.rollout.analysis.prometheusAddress | default "http://172.18.255.45" }}'
                query: |
                  {{- if eq (toString .Values.currentService) "client" }}
                  vector(1)
                  {{- else }}
                  (
                    (
                      sum(increase(gin_request_total{pod=~"{{ "{{" }}args.service-name{{ "}}" }}-.*"}[5m])) > 0
                    )
                    *
                    (
                      1 - (
                        (sum(increase(gin_request_total{pod=~"{{ "{{" }}args.service-name{{ "}}" }}-.*",code=~"5.."}[5m])) or vector(0))
                        /
                        clamp_min(sum(increase(gin_request_total{pod=~"{{ "{{" }}args.service-name{{ "}}" }}-.*"}[5m])), 1)
                      )
                    )
                  ) or vector(0)
                  {{- end }}
  canary:
