projectName: go-micro
secretStoreName: aws-secrets-manager
region: ap-southeast-2

product:
  namespace: microservices
  syncWave: "-2"
  secrets:
    refreshInterval: 1h
    data:
      - secretKey: DB_USER
        remoteRef:
          property: DB_USER
      - secretKey: DB_PASSWORD
        remoteRef:
          property: DB_PASSWORD
      - secretKey: DB_NAME
        remoteRef:
          property: PRODUCT_DB_NAME

inventory:
  namespace: microservices
  syncWave: "-2"
  secrets:
    refreshInterval: 1h
    data:
      - secretKey: DB_USER
        remoteRef:
          property: DB_USER
      - secretKey: DB_PASSWORD
        remoteRef:
          property: DB_PASSWORD
      - secretKey: DB_NAME
        remoteRef:
          property: INVENTORY_DB_NAME

order:
  namespace: microservices
  syncWave: "-2"
  secrets:
    refreshInterval: 1h
    data:
      - secretKey: DB_USER
        remoteRef:
          property: DB_USER
      - secretKey: DB_PASSWORD
        remoteRef:
          property: DB_PASSWORD
      - secretKey: DB_NAME
        remoteRef:
          property: ORDER_DB_NAME

noti:
  namespace: microservices
  syncWave: "-2"
  secrets:
    refreshInterval: 1h
    data:
      - secretKey: DB_USER
        remoteRef:
          property: DB_USER
      - secretKey: DB_PASSWORD
        remoteRef:
          property: DB_PASSWORD
      - secretKey: DB_NAME
        remoteRef:
          property: NOTIFICATION_DB_NAME

payment:
  namespace: microservices
  syncWave: "-2"
  secrets:
    refreshInterval: 1h
    data:
      - secretKey: DB_USER
        remoteRef:
          property: DB_USER
      - secretKey: DB_PASSWORD
        remoteRef:
          property: DB_PASSWORD
      - secretKey: DB_NAME
        remoteRef:
          property: PAYMENT_DB_NAME
      - secretKey: STRIPE_SECRET_KEY
        remoteRef:
          property: STRIPE_SECRET_KEY

rollout:
  enabled: true
  strategy: canary
  analysis:
    enabled: true
    prometheusAddress: http://172.18.255.45
    load:
      vus: 10
      duration: 30s
      errorRate: 0.1
    thresholds:
      latencyP95: 0.5
      latencyCount: 3
      latencyFailureLimit: 0
      successRate: 0.82
      successCount: 5
      successInitialDelay: 45s
      successFailureLimit: 3
    templates:
      - name: smoke-test
        args:
          - name: service-name
          - name: service-port
          - name: hostname
          - name: path-prefix
        metrics:
          - name: health-check
            count: 1
            failureLimit: 0
            provider:
              job:
                spec:
                  backoffLimit: 0
                  template:
                    spec:
                      restartPolicy: Never
                      containers:
                        - name: smoke
                          image: curlimages/curl:8.5.0
                          command:
                            - sh
                            - -c
                            - |
                              set -e
                              GATEWAY="traefik.traefik.svc.cluster.local"
                              HOST="{{ `{{` }}args.hostname{{ `}}` }}"
                              PREFIX="{{ `{{` }}args.path-prefix{{ `}}` }}"
                              RESPONSE=$(curl -i -s -X GET -H "Host: $HOST" -H "X-Canary: true" http://$GATEWAY$PREFIX/health)
                              HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP/" | awk '{print $2}')
                              if [ "$HTTP_CODE" != "200" ]; then
                                echo "FAILED: health returned $HTTP_CODE"
                                exit 1
                              fi
                              SERVED_BY=$(echo "$RESPONSE" | grep -i "X-Served-By" | awk '{print $2}' | tr -d '\r')
                              if [ "$SERVED_BY" != "canary" ]; then
                                echo "FAILED: request was not served by canary ($SERVED_BY)"
                                exit 1
                              fi
                              echo "PASSED: route gate"
      - name: business-smoke
        args:
          - name: service-name
        metrics:
          - name: business-smoke
            count: 1
            failureLimit: 0
            provider:
              job:
                spec:
                  backoffLimit: 0
                  template:
                    spec:
                      restartPolicy: Never
                      containers:
                        - name: business-smoke
                          image: curlimages/curl:8.5.0
                          command:
                            - sh
                            - -c
                            - |
                              set -e
                              SERVICE="{{ `{{` }}args.service-name{{ `}}` }}"
                              svc_port() {
                                case "$1" in
                                  product) echo 8080 ;;
                                  order) echo 8081 ;;
                                  inventory) echo 8082 ;;
                                  noti) echo 8083 ;;
                                  payment) echo 8084 ;;
                                  client) echo 80 ;;
                                  *) echo 8080 ;;
                                esac
                              }
                              curl_retry() {
                                local url="$1"
                                local method="${2:-GET}"
                                local body="${3:-}"
                                local tries=0
                                while [ $tries -lt 5 ]; do
                                  if [ -n "$body" ]; then
                                    RESP=$(curl -sS -X "$method" "$url" -H "Content-Type: application/json" -d "$body") && { echo "$RESP"; return 0; }
                                  else
                                    RESP=$(curl -sS -X "$method" "$url") && { echo "$RESP"; return 0; }
                                  fi
                                  tries=$((tries+1))
                                  sleep 2
                                done
                                return 1
                              }

                              fail() { echo "[FAIL] $1"; echo "[RAW ] $2"; exit 1; }
                              assert_field() {
                                local label="$1" value="$2" body="$3"
                                [ -n "$value" ] || fail "$label missing or empty" "$body"
                              }
                              assert_contains() {
                                local label="$1" pattern="$2" body="$3"
                                echo "$body" | grep -qF "$pattern" || fail "$label not found (expected '$pattern')" "$body"
                              }

                              case "$SERVICE" in
                                product)
                                  BASE="http://${SERVICE}-canary:$(svc_port "$SERVICE")"
                                  NAME="canary-smoke-${RANDOM}"
                                  CREATE_BODY=$(curl -sS -X POST "$BASE/products" -H "Content-Type: application/json" -d "{\"name\":\"$NAME\",\"description\":\"canary-smoke\",\"price\":11.11}")
                                  echo "[DBG] product create: $CREATE_BODY"
                                  PRODUCT_ID=$(echo "$CREATE_BODY" | sed -n 's/.*"id":[[:space:]]*\([0-9][0-9]*\).*/\1/p')
                                  assert_field "product.id" "$PRODUCT_ID" "$CREATE_BODY"
                                  assert_contains "product.name" "$NAME" "$CREATE_BODY"
                                  assert_contains "product.price" "11.11" "$CREATE_BODY"
                                  GET_BODY=$(curl -sS "$BASE/products/$PRODUCT_ID")
                                  echo "[DBG] product get: $GET_BODY"
                                  assert_contains "product.get.id" "\"id\":$PRODUCT_ID" "$GET_BODY"
                                  ;;
                                inventory)
                                  BASE="http://${SERVICE}-canary:$(svc_port "$SERVICE")"
                                  PID=$((1000 + RANDOM % 9000))
                                  CREATE_BODY=$(curl -sS -X POST "$BASE/inventory" -H "Content-Type: application/json" -d "{\"product_id\":$PID,\"quantity\":20,\"sku\":\"SKU-$PID\",\"location\":\"A1\"}")
                                  echo "[DBG] inventory create: $CREATE_BODY"
                                  INV_ID=$(echo "$CREATE_BODY" | sed -n 's/.*"id":[[:space:]]*\([0-9][0-9]*\).*/\1/p')
                                  assert_field "inventory.id" "$INV_ID" "$CREATE_BODY"
                                  assert_contains "inventory.quantity" "\"quantity\":20" "$CREATE_BODY"
                                  assert_contains "inventory.sku" "SKU-$PID" "$CREATE_BODY"
                                  ;;
                                order)
                                  P_BASE="http://product:$(svc_port product)"
                                  I_BASE="http://inventory:$(svc_port inventory)"
                                  O_BASE="http://${SERVICE}-canary:$(svc_port "$SERVICE")"
                                  PID=$(( $(date +%s) + RANDOM ))
                                  P_CREATE=$(curl_retry "$P_BASE/products" "POST" "{\"name\":\"order-pre-$PID\",\"description\":\"seed\",\"price\":15.5}")
                                  echo "[DBG] order seed product: $P_CREATE"
                                  REAL_PID=$(echo "$P_CREATE" | sed -n 's/.*"id":[[:space:]]*\([0-9][0-9]*\).*/\1/p')
                                  assert_field "order.seed_product_id" "$REAL_PID" "$P_CREATE"
                                  curl_retry "$I_BASE/inventory" "POST" "{\"product_id\":$REAL_PID,\"quantity\":30,\"sku\":\"OSKU-$PID\",\"location\":\"B2\"}" >/dev/null
                                  ORDER_BODY=$(curl_retry "$O_BASE/orders" "POST" "{\"customer_id\":1,\"product_id\":$REAL_PID,\"quantity\":1,\"total_price\":15.5}")
                                  echo "[DBG] order create: $ORDER_BODY"
                                  ORDER_ID=$(echo "$ORDER_BODY" | sed -n 's/.*"id":[[:space:]]*\([0-9][0-9]*\).*/\1/p')
                                  assert_field "order.id" "$ORDER_ID" "$ORDER_BODY"
                                  assert_contains "order.customer_id" "\"customer_id\":1" "$ORDER_BODY"
                                  assert_contains "order.product_id" "\"product_id\":$REAL_PID" "$ORDER_BODY"
                                  ;;
                                payment)
                                  BASE="http://${SERVICE}-canary:$(svc_port "$SERVICE")"
                                  PAY_BODY=$(curl_retry "$BASE/payments/" "POST" '{"order_id":9001,"customer_id":1,"amount":10.5,"currency":"usd"}')
                                  echo "[DBG] payment create: $PAY_BODY"
                                  assert_contains "payment.key" "\"payment\"" "$PAY_BODY"
                                  assert_contains "payment.amount" "10.5" "$PAY_BODY"
                                  assert_contains "payment.currency" "usd" "$PAY_BODY"
                                  ;;
                                noti)
                                  BASE="http://${SERVICE}-canary:$(svc_port "$SERVICE")"
                                  NOTI_BODY=$(curl -sS -X POST "$BASE/notifications" -H "Content-Type: application/json" -d '{"order_id":9001,"customer_id":1,"message":"canary smoke","status":"pending"}')
                                  echo "[DBG] noti create: $NOTI_BODY"
                                  NOTI_ID=$(echo "$NOTI_BODY" | sed -n 's/.*"id":[[:space:]]*\([0-9][0-9]*\).*/\1/p')
                                  assert_field "noti.id" "$NOTI_ID" "$NOTI_BODY"
                                  assert_contains "noti.status" "pending" "$NOTI_BODY"
                                  assert_contains "noti.order_id" "9001" "$NOTI_BODY"
                                  ;;
                                *)
                                  echo "SKIP: no business-smoke profile for $SERVICE"
                                  ;;
                              esac
                              echo "PASSED: business smoke for $SERVICE"
      - name: dependency-check
        args:
          - name: service-name
        metrics:
          - name: dependency-check
            count: 1
            failureLimit: 0
            provider:
              job:
                spec:
                  backoffLimit: 0
                  template:
                    spec:
                      restartPolicy: Never
                      containers:
                        - name: dependency-check
                          image: curlimages/curl:8.5.0
                          command:
                            - sh
                            - -c
                            - |
                              set -e
                              SERVICE="{{ `{{` }}args.service-name{{ `}}` }}"
                              svc_port() {
                                case "$1" in
                                  product) echo 8080 ;;
                                  order) echo 8081 ;;
                                  inventory) echo 8082 ;;
                                  noti) echo 8083 ;;
                                  payment) echo 8084 ;;
                                  client) echo 80 ;;
                                  *) echo 8080 ;;
                                esac
                              }
                              curl_retry() {
                                local url="$1"
                                local method="${2:-GET}"
                                local body="${3:-}"
                                local tries=0
                                while [ $tries -lt 5 ]; do
                                  if [ -n "$body" ]; then
                                    RESP=$(curl -sS -X "$method" "$url" -H "Content-Type: application/json" -d "$body") && { echo "$RESP"; return 0; }
                                  else
                                    RESP=$(curl -sS -X "$method" "$url") && { echo "$RESP"; return 0; }
                                  fi
                                  tries=$((tries+1))
                                  sleep 2
                                done
                                return 1
                              }

                              fail() { echo "[FAIL] $1"; echo "[RAW ] $2"; exit 1; }
                              assert_field() {
                                local label="$1" value="$2" body="$3"
                                [ -n "$value" ] || fail "$label missing or empty" "$body"
                              }
                              assert_contains() {
                                local label="$1" pattern="$2" body="$3"
                                echo "$body" | grep -qF "$pattern" || fail "$label not found (expected '$pattern')" "$body"
                              }

                              case "$SERVICE" in
                                product)
                                  BASE="http://${SERVICE}-canary:$(svc_port "$SERVICE")"
                                  LIST_BODY=$(curl -sS "$BASE/products")
                                  echo "[DBG] product list: $LIST_BODY"
                                  # List phải là JSON array hợp lệ ([] hoặc có id)
                                  echo "$LIST_BODY" | grep -qE '^\[' || fail "product.list not a JSON array" "$LIST_BODY"
                                  ;;
                                inventory)
                                  BASE="http://${SERVICE}-canary:$(svc_port "$SERVICE")"
                                  PID=$((3000 + RANDOM % 9000))
                                  CREATE_BODY=$(curl -sS -X POST "$BASE/inventory" -H "Content-Type: application/json" -d "{\"product_id\":$PID,\"quantity\":9,\"sku\":\"DSKU-$PID\",\"location\":\"C3\"}")
                                  echo "[DBG] inventory dep create: $CREATE_BODY"
                                  INV_ID=$(echo "$CREATE_BODY" | sed -n 's/.*"id":[[:space:]]*\([0-9][0-9]*\).*/\1/p')
                                  assert_field "inventory.dep.id" "$INV_ID" "$CREATE_BODY"
                                  assert_contains "inventory.dep.quantity" "\"quantity\":9" "$CREATE_BODY"
                                  assert_contains "inventory.dep.sku" "DSKU-$PID" "$CREATE_BODY"
                                  GET_BODY=$(curl -sS "$BASE/inventory/$INV_ID")
                                  echo "[DBG] inventory dep get: $GET_BODY"
                                  assert_contains "inventory.dep.get.id" "\"id\":$INV_ID" "$GET_BODY"
                                  assert_contains "inventory.dep.get.location" "C3" "$GET_BODY"
                                  ;;
                                order)
                                  P_BASE="http://product:$(svc_port product)"
                                  I_BASE="http://inventory:$(svc_port inventory)"
                                  O_BASE="http://${SERVICE}-canary:$(svc_port "$SERVICE")"
                                  PID=$(( $(date +%s) + RANDOM ))
                                  P_CREATE=$(curl_retry "$P_BASE/products" "POST" "{\"name\":\"dep-pre-$PID\",\"description\":\"seed\",\"price\":21.5}")
                                  echo "[DBG] order dep seed product: $P_CREATE"
                                  REAL_PID=$(echo "$P_CREATE" | sed -n 's/.*"id":[[:space:]]*\([0-9][0-9]*\).*/\1/p')
                                  assert_field "order.dep.seed_product_id" "$REAL_PID" "$P_CREATE"
                                  curl_retry "$I_BASE/inventory" "POST" "{\"product_id\":$REAL_PID,\"quantity\":25,\"sku\":\"ODSKU-$PID\",\"location\":\"D4\"}" >/dev/null
                                  ORDER_BODY=$(curl_retry "$O_BASE/orders" "POST" "{\"customer_id\":1,\"product_id\":$REAL_PID,\"quantity\":1,\"total_price\":21.5}")
                                  echo "[DBG] order dep create: $ORDER_BODY"
                                  ORDER_ID=$(echo "$ORDER_BODY" | sed -n 's/.*"id":[[:space:]]*\([0-9][0-9]*\).*/\1/p')
                                  assert_field "order.dep.id" "$ORDER_ID" "$ORDER_BODY"
                                  assert_contains "order.dep.total_price" "21.5" "$ORDER_BODY"
                                  ORDER_LIST=$(curl_retry "$O_BASE/orders")
                                  echo "[DBG] order dep list: $ORDER_LIST"
                                  assert_contains "order.dep.list.id" "\"id\":$ORDER_ID" "$ORDER_LIST"
                                  ;;
                                payment)
                                  BASE="http://${SERVICE}-canary:$(svc_port "$SERVICE")"
                                  PAY_ORDER_ID=$((5000 + RANDOM % 9000))
                                  PAY_CREATE=$(curl -sS -X POST "$BASE/payments/" -H "Content-Type: application/json" -d "{\"order_id\":$PAY_ORDER_ID,\"customer_id\":1,\"amount\":12.34,\"currency\":\"usd\"}")
                                  echo "[DBG] payment dep create: $PAY_CREATE"
                                  BY_ORDER=$(curl -sS "$BASE/payments/order/$PAY_ORDER_ID")
                                  echo "[DBG] payment dep by_order: $BY_ORDER"
                                  assert_contains "payment.dep.order_id" "\"order_id\":$PAY_ORDER_ID" "$BY_ORDER"
                                  assert_contains "payment.dep.amount" "12.34" "$BY_ORDER"
                                  assert_contains "payment.dep.currency" "usd" "$BY_ORDER"
                                  ;;
                                noti)
                                  BASE="http://${SERVICE}-canary:$(svc_port "$SERVICE")"
                                  CREATE_BODY=$(curl -sS -X POST "$BASE/notifications" -H "Content-Type: application/json" -d '{"order_id":7001,"customer_id":1,"message":"dep check","status":"pending"}')
                                  echo "[DBG] noti dep create: $CREATE_BODY"
                                  NOTI_ID=$(echo "$CREATE_BODY" | sed -n 's/.*"id":[[:space:]]*\([0-9][0-9]*\).*/\1/p')
                                  assert_field "noti.dep.id" "$NOTI_ID" "$CREATE_BODY"
                                  assert_contains "noti.dep.status" "pending" "$CREATE_BODY"
                                  DELIVER=$(curl -sS -X PUT "$BASE/notifications/$NOTI_ID/deliver")
                                  echo "[DBG] noti dep deliver: $DELIVER"
                                  assert_contains "noti.dep.deliver" "delivered" "$DELIVER"
                                  ;;
                                *)
                                  echo "SKIP: no dependency profile for $SERVICE"
                                  ;;
                              esac
                              echo "PASSED: dependency check for $SERVICE"
      - name: synthetic-load
        args:
          - name: service-name
        metrics:
          - name: load-generator-k6
            count: 1
            failureLimit: 0
            provider:
              job:
                spec:
                  backoffLimit: 0
                  template:
                    spec:
                      restartPolicy: Never
                      containers:
                        - name: k6
                          image: grafana/k6:latest
                          command: ["sh", "-c"]
                          args:
                            - |
                              cat <<'EOF' | k6 run -
                              import http from 'k6/http';
                              import { check, sleep } from 'k6';
                              export const options = {
                                vus: {{ .Values.rollout.analysis.load.vus | default 10 }},
                                duration: '{{ .Values.rollout.analysis.load.duration | default "30s" }}',
                                thresholds: {
                                  http_req_failed: ['rate<{{ .Values.rollout.analysis.load.errorRate | default 0.1 }}'],
                                  http_req_duration: ['p(95)<2000'],
                                },
                              };
                              function targetPort(service) {
                                const ports = { product: 8080, order: 8081, inventory: 8082, noti: 8083, payment: 8084, client: 80 };
                                return ports[service] || 8080;
                              }
                              function probePath(service) {
                                if (service === 'client') return '/';
                                if (service === 'order') return '/orders';
                                return '/health';
                              }
                              export default function () {
                                const service = '{{ `{{` }}args.service-name{{ `}}` }}';
                                const port = targetPort(service);
                                const path = probePath(service);
                                let res = http.get(`http://${service}-canary:${port}${path}`);
                                check(res, { 'status is 200': (r) => r.status === 200 });
                                sleep(0.3);
                              }
                              EOF
          - name: latency-p95-check
            interval: 15s
            count: '{{ .Values.rollout.analysis.thresholds.latencyCount | default 3 }}'
            initialDelay: 20s
            failureLimit: '{{ .Values.rollout.analysis.thresholds.latencyFailureLimit | default 0 }}'
            successCondition: 'result[0] == 999 || result[0] < {{ .Values.rollout.analysis.thresholds.latencyP95 | default 0.5 }}'
            provider:
              prometheus:
                address: '{{ .Values.rollout.analysis.prometheusAddress | default "http://172.18.255.45" }}'
                query: |
                  (
                    histogram_quantile(0.95, sum(increase(gin_request_duration_bucket{pod=~'{{ `{{` }}args.service-name{{ `}}` }}-.*'}[5m])) by (le))
                    unless
                    sum(increase(gin_request_duration_count{pod=~'{{ `{{` }}args.service-name{{ `}}` }}-.*'}[5m])) < 1
                  ) or vector(999)
      - name: success-rate
        args:
          - name: service-name
        metrics:
          - name: success-rate
            interval: 30s
            count: 5
            initialDelay: '45s'
            failureLimit: 3
            successCondition: 'result[0] >= {{ .Values.rollout.analysis.thresholds.successRate | default 0.82 }}'
            failureCondition: 'result[0] < {{ .Values.rollout.analysis.thresholds.successRate | default 0.82 }}'
            provider:
              prometheus:
                address: '{{ .Values.rollout.analysis.prometheusAddress | default "http://172.18.255.45" }}'
                query: |
                  (
                    (
                      sum(increase(gin_request_total{pod=~"{{ "{{" }}args.service-name{{ "}}" }}-.*"}[5m])) > 0
                    )
                    *
                    (
                      1 - (
                        (sum(increase(gin_request_total{pod=~"{{ "{{" }}args.service-name{{ "}}" }}-.*",code=~"5.."}[5m])) or vector(0))
                        /
                        clamp_min(sum(increase(gin_request_total{pod=~"{{ "{{" }}args.service-name{{ "}}" }}-.*"}[5m])), 1)
                      )
                    )
                  ) or vector(0)
  canary:
    steps:
      - setWeight: 5
      - analysis:
          templates:
            - templateName: '{{ include "template.fullname" . }}-smoke-test'
          args:
            - name: service-name
              value: '{{ include "template.fullname" . }}'
            - name: service-port
              value: '{{ .Values.service.port }}'
            - name: hostname
              value: '{{ .Values.traefik.hostname }}'
            - name: path-prefix
              value: '{{ .Values.traefik.pathPrefix | default "" }}'
      - analysis:
          templates:
            - templateName: '{{ include "template.fullname" . }}-business-smoke'
          args:
            - name: service-name
              value: '{{ include "template.fullname" . }}'
      - analysis:
          templates:
            - templateName: '{{ include "template.fullname" . }}-dependency-check'
          args:
            - name: service-name
              value: '{{ include "template.fullname" . }}'
      - setWeight: 50
      - setWeight: 100
  blueGreen:
    activeService: ""
    previewService: ""
    autoPromotionEnabled: true
    scaleDownDelaySeconds: 30
