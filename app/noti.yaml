# Notification Service - Override values for template/values.yaml
replicaCount: 1

image:
  repository: minhtri1612/go-microservice
  pullPolicy: Always
  tag: "notification-service-v1.0.1"

service:
  type: ClusterIP
  port: 8083
  targetPort: 8083

ingress:
  enabled: false

resources:
  limits:
    cpu: 300m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

livenessProbe:
  httpGet: null
  tcpSocket:
    port: 8083
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet: null
  tcpSocket:
    port: 8083
  initialDelaySeconds: 10
  periodSeconds: 5

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podMonitor:
  enabled: true

useExternalSecrets: true
workloadKind: rollout

routing:
  provider: traefik

traefik:
  enabled: true
  ingressRouteForServices:
    - noti

rollout:
  enabled: true
  revisionHistoryLimit: 3
  canary:
    stableService: ""
    canaryService: ""
    maxSurge: 25%
    maxUnavailable: 0
    steps:
      - setWeight: 10
      - pause:
          duration: 5s
      - analysis:
          templates:
            - templateName: '{{ include "template.fullname" . }}-success-rate'
          args:
            - name: service-name
              value: '{{ include "template.fullname" . }}'
      - setWeight: 50
      - pause:
          duration: 5s
      - setWeight: 100
  analysis:
    enabled: true
    templates:
      - name: success-rate
        args:
          - name: service-name
        metrics:
          - name: success-rate
            interval: 30s
            count: 5
            initialDelay: 45s
            failureLimit: 3
            successCondition: result[0] >= 0.82
            failureCondition: result[0] < 0.82
            provider:
              prometheus:
                address: '{{ .Values.rollout.analysis.prometheusAddress | default "http://172.18.0.3:32090" }}'
                query: |
                  avg(meo_workload_up{namespace="{{ .Release.Namespace }}",pod=~"{{ "{{" }}args.service-name{{ "}}" }}-.*"}) or vector(0)

ciliumNetworkPolicy:
  enabled: false
  services:
    - noti