# Frontend Client - Override values for template/values.yaml
replicaCount: 2

image:
  repository: minhtri1612/go-microservice
  pullPolicy: Always
  tag: "client-v1.0.1"

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: false
  className: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: "default-cors@kubernetescrd"
  hosts:
    - host: app.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

livenessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 5
  periodSeconds: 5

client:
  configs:
    filesMountPath: /etc/nginx/conf.d
    files:
      - name: default.conf
        value: |
          server {
              listen 80;
              server_name localhost;
              root /usr/share/nginx/html;
              index index.html;

              location /api/ {
                  proxy_pass http://api-gateway:8000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location / {
                  try_files $uri $uri/ /index.html;
              }
          }

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podMonitor:
  enabled: true

useExternalSecrets: true
workloadKind: rollout

routing:
  provider: traefik

traefik:
  enabled: true
  ingressRouteForServices:
    - client

rollout:
  enabled: true
  revisionHistoryLimit: 3
  canary:
    stableService: ""
    canaryService: ""
    maxSurge: 25%
    maxUnavailable: 0
    steps:
      - setWeight: 10
      - pause:
          duration: 5s
      - analysis:
          templates:
            - templateName: '{{ include "template.fullname" . }}-success-rate'
          args:
            - name: service-name
              value: '{{ include "template.fullname" . }}'
      - setWeight: 50
      - pause:
          duration: 5s
      - setWeight: 100
  analysis:
    enabled: true
    templates:
      - name: success-rate
        args:
          - name: service-name
        metrics:
          - name: success-rate
            interval: 30s
            count: 5
            initialDelay: 45s
            failureLimit: 3
            successCondition: result[0] >= 0.82
            failureCondition: result[0] < 0.82
            provider:
              prometheus:
                address: '{{ .Values.rollout.analysis.prometheusAddress | default "http://172.18.0.3:32090" }}'
                query: |
                  avg(meo_workload_up{namespace="{{ .Release.Namespace }}",pod=~"{{ "{{" }}args.service-name{{ "}}" }}-.*"}) or vector(0)

ciliumNetworkPolicy:
  enabled: false
  services:
    - client