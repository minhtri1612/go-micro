# API Gateway - Override values for template/values.yaml
replicaCount: 2

image:
  repository: minhtri1612/go-microservice
  pullPolicy: Always
  tag: "api-gateway-v1.0.1"

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000
  aliases:
    - go-micro-api-gateway

ingress:
  enabled: false
  className: "traefik"
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: "default-cors@kubernetescrd"
  hosts:
    - host: api.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 5

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podMonitor:
  enabled: true

useExternalSecrets: true
workloadKind: rollout

routing:
  provider: traefik

traefik:
  enabled: true
  ingressRouteForServices:
    - api-gateway

rollout:
  enabled: true
  revisionHistoryLimit: 3
  canary:
    stableService: ""
    canaryService: ""
    maxSurge: 25%
    maxUnavailable: 0
    steps:
      - setWeight: 10
      - pause:
          duration: 5s
      - analysis:
          templates:
            - templateName: '{{ include "template.fullname" . }}-success-rate'
          args:
            - name: service-name
              value: '{{ include "template.fullname" . }}'
      - setWeight: 50
      - pause:
          duration: 5s
      - setWeight: 100
  analysis:
    enabled: true
    templates:
      - name: success-rate
        args:
          - name: service-name
        metrics:
          - name: success-rate
            interval: 30s
            count: 5
            initialDelay: 45s
            failureLimit: 3
            successCondition: result[0] >= 0.82
            failureCondition: result[0] < 0.82
            provider:
              prometheus:
                address: '{{ .Values.rollout.analysis.prometheusAddress | default "http://172.18.0.3:32090" }}'
                query: |
                  avg(meo_workload_up{namespace="{{ .Release.Namespace }}",pod=~"{{ "{{" }}args.service-name{{ "}}" }}-.*"}) or vector(0)

ciliumNetworkPolicy:
  enabled: false
  services:
    - api-gateway