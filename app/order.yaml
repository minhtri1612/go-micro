# Order Service - Override values for template/values.yaml
replicaCount: 1

image:
  repository: minhtri1612/go-microservice
  pullPolicy: Always
  tag: ""

service:
  type: ClusterIP
  port: 8081
  targetPort: 8081

ingress:
  enabled: false

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

livenessProbe:
  httpGet: null
  tcpSocket:
    port: 8081
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet: null
  tcpSocket:
    port: 8081
  initialDelaySeconds: 10
  periodSeconds: 5

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 8
  targetCPUUtilizationPercentage: 75

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8081"
  prometheus.io/path: "/metrics"

podMonitor:
  enabled: true

useExternalSecrets: true
workloadKind: rollout
extraEnv:
  - name: PRODUCT_SERVICE_URL
    value: http://product:8080
  - name: INVENTORY_SERVICE_URL
    value: http://inventory:8082
  - name: PAYMENT_SERVICE_URL
    value: http://payment:8084
  - name: NOTIFICATION_SERVICE_URL
    value: http://noti:8083

routing:
  provider: traefik

traefik:
  enabled: true
  pathPrefix: /api/v1/orders
  stripPrefixes:
    - /api/v1/orders
  ingressRouteForServices:
    - order

rollout:
  enabled: true
  revisionHistoryLimit: 3
  canary:
    stableService: ""
    canaryService: ""
    maxSurge: 25%
    maxUnavailable: 0
    steps:
      - setWeight: 10
      - pause:
          duration: 5s
      - analysis:
          templates:
            - templateName: '{{ include "template.fullname" . }}-success-rate'
          args:
            - name: service-name
              value: '{{ include "template.fullname" . }}'
      - setWeight: 50
      - pause:
          duration: 5s
      - setWeight: 100
  analysis:
    enabled: true
    templates:
      - name: success-rate
        args:
          - name: service-name
        metrics:
          - name: success-rate
            interval: 30s
            count: 5
            initialDelay: 45s
            failureLimit: 3
            successCondition: result[0] >= 0.82
            failureCondition: result[0] < 0.82
            provider:
              prometheus:
                address: '{{ .Values.rollout.analysis.prometheusAddress | default "http://172.18.0.3:32090" }}'
                query: |
                  avg(meo_workload_up{namespace="{{ .Release.Namespace }}",pod=~"{{ "{{" }}args.service-name{{ "}}" }}-.*"}) or vector(0)

ciliumNetworkPolicy:
  enabled: false
  services:
    - order