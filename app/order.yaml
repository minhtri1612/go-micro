# Order Service - Override values for template/values.yaml
replicaCount: 1

image:
  repository: minhtri1612/go-microservice
  pullPolicy: Always
  tag: "order-service-v1.0.1"

service:
  type: ClusterIP
  port: 8081
  targetPort: 8081

ingress:
  enabled: false

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

livenessProbe:
  httpGet: null
  tcpSocket:
    port: 8081
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet: null
  tcpSocket:
    port: 8081
  initialDelaySeconds: 10
  periodSeconds: 5

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 8
  targetCPUUtilizationPercentage: 75

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"