apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-infra-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: dev
  sources:
    - repoURL: https://github.com/minhtri1612/go-micro.git
      path: template
      targetRevision: main
      helm:
        releaseName: gateway-infra
        valueFiles:
          - $values/argocd/helm/gateway-infra-dev.yaml
    - repoURL: https://github.com/minhtri1612/go-micro.git
      targetRevision: main
      ref: values
  destination:
    name: dev
    namespace: microservices-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
