apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins-management
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://charts.jenkins.io
      chart: jenkins
      targetRevision: 5.8.110
      helm:
        releaseName: jenkins
        valueFiles:
          - $values/kind/jenkins-values.yaml
    - repoURL: https://github.com/minhtri1612/go-micro.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: jenkins
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
